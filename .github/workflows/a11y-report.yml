name: A11Y Report

# WCAG 2.2 AA status for native, mWeb and every portal, posted as ONE sticky
# comment on the pull request (rewritten on every push, never stacked) and on
# the run summary for a push to staging, where there is no PR to comment on.
#
# The lints are BLOCKING: both run as errors with --max-warnings 0. Each lint
# step still continues on error so the report is written and posted either way,
# and the last step fails the run when either lint found anything. The contrast
# gate blocks separately, in shared-gates.yml (docs/accessibility.md).
on:
  pull_request:
    branches: [main, master, develop, staging]
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: a11y-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: A11Y status (WCAG 2.2 AA)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4.4.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install (workspace)
        run: pnpm install --frozen-lockfile

      # The Expo app is a standalone npm project, not a pnpm workspace member.
      - name: Install (mobile app)
        working-directory: app/mobile-app
        run: npm ci

      - name: Contrast tokens
        continue-on-error: true
        run: |
          status=0
          node scripts/verify-contrast.mjs > "$RUNNER_TEMP/contrast.txt" 2>&1 || status=$?
          echo "$status" > "$RUNNER_TEMP/contrast.exit"

      - name: Web lint (jsx-a11y)
        id: web_lint
        continue-on-error: true
        run: pnpm lint:a11y --format json --output-file "$RUNNER_TEMP/a11y-web.json"

      - name: Native lint (react-native-a11y)
        id: native_lint
        continue-on-error: true
        working-directory: app/mobile-app
        run: npm run lint:a11y -- --format json --output-file "$RUNNER_TEMP/a11y-native.json"

      - name: Build the report
        run: |
          node scripts/a11y-report.mjs \
            --web="$RUNNER_TEMP/a11y-web.json" \
            --native="$RUNNER_TEMP/a11y-native.json" \
            --contrast="$RUNNER_TEMP/contrast.txt" \
            --contrast-exit="$(cat "$RUNNER_TEMP/contrast.exit" 2>/dev/null || echo 1)" \
            --out="$RUNNER_TEMP/a11y.md"

      - name: Comment the A11Y status on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const file = `${process.env.RUNNER_TEMP}/a11y.md`;
            if (!fs.existsSync(file)) {
              core.info('no A11Y report on disk — the report step did not run');
              return;
            }
            const body = fs.readFileSync(file, 'utf8');
            const marker = '<!-- duncit-a11y-status -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const mine = comments.find((c) => c.body?.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
              core.info(`updated A11Y comment ${mine.id}`);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info('created A11Y comment');
            }

      - name: A11Y report on the run summary
        if: always()
        run: cat "$RUNNER_TEMP/a11y.md" >> "$GITHUB_STEP_SUMMARY" || true

      # Last, so the comment and summary above always land first.
      - name: Enforce WCAG 2.2 AA lint
        if: always() && (steps.web_lint.outcome == 'failure' || steps.native_lint.outcome == 'failure')
        run: |
          echo "::error::The a11y lint found WCAG 2.2 AA issues (web: ${{ steps.web_lint.outcome }}, native: ${{ steps.native_lint.outcome }}). See the A11Y status table and docs/accessibility.md."
          exit 1
