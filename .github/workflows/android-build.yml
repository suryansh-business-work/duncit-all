# Android APK + AAB on every merge to main, and on demand from Tech → App Builds
# → Create build. Built ON THE RUNNER (never the VPS), uploaded through the
# server and recorded via reportAppBuild, which also announces it on the
# configured Slack channel (Tech portal → App Builds → Settings).
#
# The build recipe mirrors app/mobile-app/Dockerfile.android step for step
# (npm ci → codegen → expo prebuild → SDK 35 + NDK 27 → gradlew assembleRelease),
# just directly on the runner where actions/cache can persist Gradle between runs.
# Release artifacts are signed with the Google Play upload key held in encrypted
# repository secrets. The private keystore exists only on the ephemeral runner.
#
# TWO DIFFERENT SERVERS are in play on a dispatched build and confusing them is
# the easy mistake: `app_env` chooses what the BUILT APP talks to, and is baked
# in at compile time; `report_url` chooses where the build RECORDS ITSELF, and
# is always the portal that started it. A staging-pointed build triggered from
# production is therefore listed in production.
#
# Secrets: ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_STORE_PASSWORD,
# ANDROID_UPLOAD_KEY_ALIAS and ANDROID_UPLOAD_KEY_PASSWORD sign both artifacts.
# EXPO_TOKEN submits an opted-in AAB through EAS to Play's internal testing
# track. DUNCIT_RELEASE_TOKEN (a SUPER_ADMIN / TECH_MANAGER JWT) or
# DUNCIT_RELEASE_EMAIL + DUNCIT_RELEASE_PASSWORD reports them. Add
# DUNCIT_RELEASE_TOKEN_STAGING as well to let the staging portal start builds —
# each server signs its own tokens, so production's is not valid there.
# ImageKit/Slack credentials stay in the Tech portal env entries.
name: Android Build

on:
  push:
    branches: [main]
  # The Tech portal dispatches this with every input filled in; a human running
  # it from the Actions tab gets the same defaults a merge to main would.
  workflow_dispatch:
    inputs:
      app_env:
        description: Which server and database the built app talks to
        type: choice
        options: [production, staging]
        default: production
      artifacts:
        description: What to build — APK, AAB, or APK,AAB for both
        type: string
        default: APK,AAB
      submit_to_play_store:
        description: Submit the AAB to Google Play internal testing after it builds
        type: boolean
        default: false
      dispatch_id:
        description: Set by the Tech portal to claim the row it already created. Leave empty by hand.
        type: string
        default: ''
      report_url:
        description: GraphQL endpoint to record the build in. Empty reports to production.
        type: string
        default: ''

# Never kill a running build. GitHub still keeps only the NEWEST queued run per
# group, so a merge landing mid-build can be superseded — the reporter closes
# that changelog gap by ranging from the last build the server recorded.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Baked into the binary at compile time, which is why it is a build-time
  # choice and not a setting in the app. A push to main always means production;
  # only an explicit dispatch can ask for staging.
  EXPO_PUBLIC_API_URL: >-
    ${{ inputs.app_env == 'staging' && 'https://staging.server.duncit.com' || 'https://server.duncit.com' }}
  # WHERE the build records itself, which is deliberately NOT the same question
  # as which server its app talks to: a build always reports to the portal that
  # started it, so a staging-pointed build triggered from production is still
  # visible in production.
  REPORT_GRAPHQL_URL: ${{ inputs.report_url || 'https://server.duncit.com/graphql' }}
  CI: 1
  EXPO_NO_TELEMETRY: 1
  CYPRESS_INSTALL_BINARY: 0
  # Set (via GITHUB_ENV) the moment the built APK and AAB are copied out — the
  # failure reporter uses it to tell "build failed" from "reporting failed".
  ARTIFACT_PATHS: ''
  # What the job is doing, rewritten by a marker step before each long stage.
  # A value written to GITHUB_ENV lands on the NEXT step, which is exactly what
  # makes this work: the marker names the step that follows it, so whatever
  # BUILD_STAGE holds when the job dies is the stage that actually broke.
  BUILD_STAGE: ''

jobs:
  build:
    name: Build & publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Each server signs its own tokens, so a production JWT is not valid on
      # staging. Picking the secret from where the build reports is what lets a
      # staging portal start builds at all. The secrets context is unavailable
      # in workflow-level env, which is why this lives on the job.
      REPORT_TOKEN: >-
        ${{ contains(inputs.report_url, 'staging.') && secrets.DUNCIT_RELEASE_TOKEN_STAGING || secrets.DUNCIT_RELEASE_TOKEN }}
      REPORT_EMAIL: ${{ secrets.DUNCIT_RELEASE_EMAIL }}
      REPORT_PASSWORD: ${{ secrets.DUNCIT_RELEASE_PASSWORD }}
      # A merge to main wants everything; a dispatch builds only what was asked
      # for, and an APK-only build skips the bundle task entirely.
      WANTED_ARTIFACTS: ${{ inputs.artifacts || 'APK,AAB' }}
      DISPATCH_ID: ${{ inputs.dispatch_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    defaults:
      run:
        working-directory: app/mobile-app
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the report step describes the merged commit range.
          fetch-depth: 0

      - name: Record build start
        run: |
          NOW=$(date +%s)
          {
            echo "BUILD_STARTED_AT=$NOW"
            # Seconds since 2020 are monotonic, Play-safe (< 2.1bn), and avoid
            # the versionCode=1 that Expo prebuild otherwise writes every run.
            echo "ANDROID_VERSION_CODE=$((NOW - 1577836800))"
          } >> "$GITHUB_ENV"

      - name: Normalise the artifact list
        # Both readers below match on exact commas (",APK,"), so "APK, AAB" —
        # the natural way to type it when dispatching by hand — would match the
        # APK and silently drop the AAB. Normalised ONCE here rather than at
        # each use, and the write lands on every following step.
        run: |
          echo "WANTED_ARTIFACTS=$(echo "$WANTED_ARTIFACTS" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')" >> "$GITHUB_ENV"

      - name: Validate Play Store request
        if: inputs.submit_to_play_store
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ "${{ inputs.app_env }}" != "production" ]; then
            echo "::error::Play Store submission requires a production build"
            exit 1
          fi
          case ",$WANTED_ARTIFACTS," in
            *,AAB,*) ;;
            *)
              echo "::error::Play Store submission requires the AAB artifact"
              exit 1
              ;;
          esac
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is missing"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/mobile-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Report the build as started
        # Opens the row the Tech portal shows spinning, so a build is visible
        # while it is being made rather than only when it is over. Best-effort
        # on purpose: a build must not be abandoned because the table could not
        # be told it began — the final report is the one that fails loudly.
        continue-on-error: true
        working-directory: .
        env:
          PLATFORM: ANDROID
          STATUS: RUNNING
          BUILD_STAGE: Starting up
          DISPATCH_ID: ${{ env.DISPATCH_ID }}
          DUNCIT_GRAPHQL_URL: ${{ env.REPORT_GRAPHQL_URL }}
          DUNCIT_RELEASE_TOKEN: ${{ env.REPORT_TOKEN }}
          DUNCIT_RELEASE_EMAIL: ${{ env.REPORT_EMAIL }}
          DUNCIT_RELEASE_PASSWORD: ${{ env.REPORT_PASSWORD }}
          GIT_BEFORE: ${{ github.event.before }}
          RUN_URL: ${{ env.RUN_URL }}
        run: node scripts/report-app-build.mjs

      - name: 'Stage: install dependencies'
        uses: ./.github/actions/build-stage
        with:
          stage: Installing JS dependencies
          platform: ANDROID
          dispatch_id: ${{ env.DISPATCH_ID }}
          graphql_url: ${{ env.REPORT_GRAPHQL_URL }}
          release_token: ${{ env.REPORT_TOKEN }}
          release_email: ${{ env.REPORT_EMAIL }}
          release_password: ${{ env.REPORT_PASSWORD }}
          run_url: ${{ env.RUN_URL }}

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: 'Stage: codegen'
        uses: ./.github/actions/build-stage
        with:
          stage: Generating GraphQL types
          platform: ANDROID
          dispatch_id: ${{ env.DISPATCH_ID }}
          graphql_url: ${{ env.REPORT_GRAPHQL_URL }}
          release_token: ${{ env.REPORT_TOKEN }}
          release_email: ${{ env.REPORT_EMAIL }}
          release_password: ${{ env.REPORT_PASSWORD }}
          run_url: ${{ env.RUN_URL }}

      - name: Generate GraphQL types
        # src/generated is gitignored — regenerated from the server schemas in this checkout.
        run: npm run codegen

      - name: 'Stage: prebuild'
        uses: ./.github/actions/build-stage
        with:
          stage: Generating the native Android project
          platform: ANDROID
          dispatch_id: ${{ env.DISPATCH_ID }}
          graphql_url: ${{ env.REPORT_GRAPHQL_URL }}
          release_token: ${{ env.REPORT_TOKEN }}
          release_email: ${{ env.REPORT_EMAIL }}
          release_password: ${{ env.REPORT_PASSWORD }}
          run_url: ${{ env.RUN_URL }}

      - name: Generate the native android project
        # android/ is gitignored (CNG) — regenerated from app.json + config plugins.
        run: npx expo prebuild --platform android --no-install --clean

      - name: Validate release-safe Android configuration
        # The first attempt at satisfying Play's R8 recommendation switched to
        # proguard-android-optimize.txt and the resulting app never left its
        # splash screen. Keep the last-known-good R8 rules until the Expo/RN AGP
        # toolchain is upgraded and that optimizer can be runtime-tested.
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          APP_GRADLE=android/app/build.gradle
          GRADLE_PROPERTIES=android/gradle.properties

          if grep -q 'android:screenOrientation=' "$MANIFEST"; then
            echo "::error::MainActivity must not restrict orientation"
            exit 1
          fi
          grep -q 'android:resizeableActivity="true"' "$MANIFEST" || {
            echo "::error::MainActivity must remain resizeable"
            exit 1
          }
          grep -q 'proguard-android.txt' "$APP_GRADLE" || {
            echo "::error::The release-safe Android ProGuard baseline changed"
            exit 1
          }
          if grep -q 'proguard-android-optimize.txt' "$APP_GRADLE"; then
            echo "::error::Aggressive R8 optimization was re-enabled without runtime qualification"
            exit 1
          fi
          grep -q '^android.enableMinifyInReleaseBuilds=true$' "$GRADLE_PROPERTIES" || exit 1
          grep -q '^android.enableShrinkResourcesInReleaseBuilds=true$' "$GRADLE_PROPERTIES" || exit 1
          grep -q '^edgeToEdgeEnabled=true$' "$GRADLE_PROPERTIES" || exit 1

      - name: Configure Google Play upload signing
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_STORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required Android signing secret $name is missing"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat <<'GRADLE' >> android/app/build.gradle

          android {
              defaultConfig {
                  versionCode System.getenv('ANDROID_VERSION_CODE').toInteger()
              }
              signingConfigs {
                  upload {
                      storeFile file('upload-keystore.jks')
                      storePassword System.getenv('ANDROID_UPLOAD_STORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_UPLOAD_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_UPLOAD_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.upload
                  }
              }
          }
          GRADLE

      - name: 'Stage: android sdk'
        uses: ./.github/actions/build-stage
        with:
          stage: Installing the Android SDK and NDK
          platform: ANDROID
          dispatch_id: ${{ env.DISPATCH_ID }}
          graphql_url: ${{ env.REPORT_GRAPHQL_URL }}
          release_token: ${{ env.REPORT_TOKEN }}
          release_email: ${{ env.REPORT_EMAIL }}
          release_password: ${{ env.REPORT_PASSWORD }}
          run_url: ${{ env.RUN_URL }}

      - name: Install Android SDK 35 + NDK 27
        # The runner ships an SDK but not NDK 27.1.12297006, which the
        # withNdkVersion plugin pins (RN 0.81 needs NDK 27's libc++).
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.1.12297006"

      # Two caches, not one, because the two halves change on different clocks.
      # The distribution moves only when the Gradle version does; the build
      # caches track the JS dependency graph. Keying both on package-lock.json
      # meant every dependency bump also evicted the distribution and forced a
      # fresh download of gradle-*-bin.zip — which is the download that fails.
      - name: Cache the Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-dist-${{ runner.os }}-${{ hashFiles('app/mobile-app/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Cache Gradle build caches
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-android-${{ runner.os }}-${{ hashFiles('app/mobile-app/package-lock.json') }}
          restore-keys: gradle-android-${{ runner.os }}-

      - name: Tune Gradle for the runner
        # R8 runs in-process in this --no-daemon JVM and OOMs below ~4g
        # (same lesson Dockerfile.android documents). Appended post-prebuild so
        # regeneration can never drop it.
        run: |
          {
            echo ''
            echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC'
            echo 'org.gradle.daemon=false'
          } >> android/gradle.properties

      - name: 'Stage: gradle distribution'
        uses: ./.github/actions/build-stage
        with:
          stage: Fetching the Gradle distribution
          platform: ANDROID
          dispatch_id: ${{ env.DISPATCH_ID }}
          graphql_url: ${{ env.REPORT_GRAPHQL_URL }}
          release_token: ${{ env.REPORT_TOKEN }}
          release_email: ${{ env.REPORT_EMAIL }}
          release_password: ${{ env.REPORT_PASSWORD }}
          run_url: ${{ env.RUN_URL }}

      - name: Fetch the Gradle distribution
        # On a cold cache the wrapper downloads gradle-*-bin.zip itself, with ONE
        # attempt and no retry, so a connection dropped mid-transfer kills the
        # build with "Unexpected end of file from server" — and it does so AFTER
        # npm ci, codegen, prebuild and the SDK/NDK install have already run, so
        # a network blip costs the whole job. Doing the fetch here, on its own,
        # costs nothing when the cache is warm and survives a blip when it is not.
        working-directory: app/mobile-app/android
        run: |
          for attempt in 1 2 3 4 5; do
            if ./gradlew --version; then exit 0; fi
            echo "::warning::Gradle distribution fetch failed (attempt $attempt/5)"
            sleep $((attempt * 20))
          done
          echo "::error::Could not fetch the Gradle distribution after 5 attempts"
          exit 1

      - name: 'Stage: gradle build'
        uses: ./.github/actions/build-stage
        with:
          stage: Compiling with Gradle
          platform: ANDROID
          dispatch_id: ${{ env.DISPATCH_ID }}
          graphql_url: ${{ env.REPORT_GRAPHQL_URL }}
          release_token: ${{ env.REPORT_TOKEN }}
          release_email: ${{ env.REPORT_EMAIL }}
          release_password: ${{ env.REPORT_PASSWORD }}
          run_url: ${{ env.RUN_URL }}

      - name: Build the release artifacts
        # Whatever was asked for, from ONE gradle invocation: the APK and the AAB
        # share the compile, so building them separately would pay for it twice
        # and could disagree. assembleRelease -> the APK people sideload;
        # bundleRelease -> the AAB Play requires.
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        working-directory: app/mobile-app/android
        run: |
          TASKS=""
          case ",$WANTED_ARTIFACTS," in *,APK,*) TASKS="$TASKS assembleRelease" ;; esac
          case ",$WANTED_ARTIFACTS," in *,AAB,*) TASKS="$TASKS bundleRelease" ;; esac
          if [ -z "$TASKS" ]; then
            echo "::error::No buildable artifact in '$WANTED_ARTIFACTS' — expected APK, AAB or both"
            exit 1
          fi
          echo "Building:$TASKS"
          # Unquoted on purpose: $TASKS is a list of gradle tasks, not one word.
          # shellcheck disable=SC2086
          ./gradlew $TASKS --no-daemon --stacktrace

      - name: 'Stage: Play Store submission'
        if: inputs.submit_to_play_store
        uses: ./.github/actions/build-stage
        with:
          stage: Submitting the AAB to Google Play internal testing
          platform: ANDROID
          dispatch_id: ${{ env.DISPATCH_ID }}
          graphql_url: ${{ env.REPORT_GRAPHQL_URL }}
          release_token: ${{ env.REPORT_TOKEN }}
          release_email: ${{ env.REPORT_EMAIL }}
          release_password: ${{ env.REPORT_PASSWORD }}
          run_url: ${{ env.RUN_URL }}

      - name: Submit AAB to Google Play internal testing
        if: inputs.submit_to_play_store
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: >-
          npx --yes eas-cli@22.0.0 submit
          --platform android
          --profile internal
          --path android/app/build/outputs/bundle/release/app-release.aab
          --non-interactive
          --wait

      - name: 'Stage: name the artifacts'
        uses: ./.github/actions/build-stage
        with:
          stage: Collecting the built artifacts
          platform: ANDROID
          dispatch_id: ${{ env.DISPATCH_ID }}
          graphql_url: ${{ env.REPORT_GRAPHQL_URL }}
          release_token: ${{ env.REPORT_TOKEN }}
          release_email: ${{ env.REPORT_EMAIL }}
          release_password: ${{ env.REPORT_PASSWORD }}
          run_url: ${{ env.RUN_URL }}

      - name: Name the artifacts
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          BASE="duncit-android-v${APP_VERSION}-${SHORT_SHA}"
          # Copy FIRST, write the env file second. Under `bash -e` a failing cp
          # inside the heredoc block would abort it after the opening
          # ARTIFACT_PATHS<<ARTIFACTS_EOF line, leaving the delimiter unclosed —
          # the runner then dies on "Matching delimiter not found", which
          # replaces the real error in the log with a confusing one.
          PATHS=""
          case ",$WANTED_ARTIFACTS," in *,APK,*)
            cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$BASE.apk"
            PATHS="$RUNNER_TEMP/$BASE.apk"
            ;;
          esac
          case ",$WANTED_ARTIFACTS," in *,AAB,*)
            cp android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/$BASE.aab"
            PATHS="${PATHS:+$PATHS$'\n'}$RUNNER_TEMP/$BASE.aab"
            ;;
          esac
          # Newline-separated, APK FIRST — the reporter treats the first path as
          # the build's primary artifact. Only what was actually built is listed.
          {
            echo "ARTIFACT_PATHS<<ARTIFACTS_EOF"
            echo "$PATHS"
            echo "ARTIFACTS_EOF"
          } >> "$GITHUB_ENV"

      - name: 'Stage: upload and record'
        uses: ./.github/actions/build-stage
        with:
          stage: Uploading the artifacts and recording the build
          platform: ANDROID
          dispatch_id: ${{ env.DISPATCH_ID }}
          graphql_url: ${{ env.REPORT_GRAPHQL_URL }}
          release_token: ${{ env.REPORT_TOKEN }}
          release_email: ${{ env.REPORT_EMAIL }}
          release_password: ${{ env.REPORT_PASSWORD }}
          run_url: ${{ env.RUN_URL }}

      - name: Upload the artifacts & record the build
        working-directory: .
        env:
          PLATFORM: ANDROID
          DISPATCH_ID: ${{ env.DISPATCH_ID }}
          DUNCIT_GRAPHQL_URL: ${{ env.REPORT_GRAPHQL_URL }}
          DUNCIT_RELEASE_TOKEN: ${{ env.REPORT_TOKEN }}
          DUNCIT_RELEASE_EMAIL: ${{ env.REPORT_EMAIL }}
          DUNCIT_RELEASE_PASSWORD: ${{ env.REPORT_PASSWORD }}
          GIT_BEFORE: ${{ github.event.before }}
          RUN_URL: ${{ env.RUN_URL }}
        run: node scripts/report-app-build.mjs

      - name: Remove the upload keystore from the runner
        if: always()
        run: rm -f android/app/upload-keystore.jks

      - name: Record the failure
        # Only when nothing was produced (ARTIFACT_PATHS is set right after the
        # build) — a reporting/upload hiccup on a good build must stay a red
        # workflow, not a false ':x: build failed' row and Slack alarm. That
        # leaves the RUNNING row standing in the one case where the reporter
        # itself is broken, which is honest: nothing it said could be trusted.
        # continue-on-error so a reporting hiccup never hides the real failure.
        if: failure() && env.ARTIFACT_PATHS == ''
        continue-on-error: true
        working-directory: .
        env:
          PLATFORM: ANDROID
          STATUS: FAILED
          DISPATCH_ID: ${{ env.DISPATCH_ID }}
          DUNCIT_GRAPHQL_URL: ${{ env.REPORT_GRAPHQL_URL }}
          DUNCIT_RELEASE_TOKEN: ${{ env.REPORT_TOKEN }}
          DUNCIT_RELEASE_EMAIL: ${{ env.REPORT_EMAIL }}
          DUNCIT_RELEASE_PASSWORD: ${{ env.REPORT_PASSWORD }}
          GIT_BEFORE: ${{ github.event.before }}
          RUN_URL: ${{ env.RUN_URL }}
        run: node scripts/report-app-build.mjs
