# Duncit CRM iPhone app (app/crm-app) as an App Store-signed IPA, on every push
# to staging and main that touches the CRM app, and on demand from Tech → App
# Builds → Duncit CRM iOS → Create build. The Android app is crm-android-build.yml.
#
# The recipe is ios-build.yml's, minus what only the member app needs
# (Truecaller): npm ci → codegen → expo prebuild → pod install → xcodebuild
# archive → export, on a GitHub macOS runner. The IPA is uploaded through the
# server and recorded with reportAppBuild under app CRM (its own rows, never
# mixed with the member app's) and announced on the Duncit CRM Slack channel,
# falling back to the iOS builds channel. CRM staff see it on the CRM portal's
# Download CRM App page.
#
# SIGNED with the member app's Apple Distribution certificate — Apple allows a
# team very few — and an App Store profile for the CRM bundle ID, which the
# server makes the first time this asks (crmIosSigningBundle). The one setting
# it needs is the Duncit CRM Bundle ID on Tech → Environment → App Store Connect.
# An App Store-signed IPA installs only through TestFlight or the App Store, so
# an opted-in dispatch uploads it to App Store Connect with the same key; that
# needs the "Duncit CRM" app created once in App Store Connect.
#
# Xcode 26, not 27, on purpose: an app linked against the iOS 27 SDK must adopt
# the UIScene life cycle or UIKit kills it at launch, and the CRM app has not
# adopted it (the member app's prebuild plugin is its own and not shared). App
# Store Connect accepts Xcode 26 builds until April 2027 (ITMS-90725); before
# then this moves to the xcode-27 runner together with a scene life cycle
# plugin in app/crm-app.
#
# Where it records itself: a staging push reports to the STAGING server when
# DUNCIT_RELEASE_TOKEN_STAGING is set; everything else reports to production. A
# portal-started build reports to the portal that started it.
name: CRM iOS Build

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      app_env:
        description: Which server and database the built app talks to
        type: choice
        options: [production, staging]
        default: production
      submit_to_app_store:
        description: Upload the IPA to App Store Connect (TestFlight) after it builds
        type: boolean
        default: false
      dispatch_id:
        description: Set by the Tech portal to claim the row it already created. Leave empty by hand.
        type: string
        default: ''
      report_url:
        description: GraphQL endpoint to record the build in. Empty picks by branch.
        type: string
        default: ''

concurrency:
  group: crm-ios-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP: CRM
  APP_ENV: ${{ inputs.app_env || (github.ref_name == 'staging' && 'staging' || 'production') }}
  EXPO_PUBLIC_API_URL: >-
    ${{ (inputs.app_env || (github.ref_name == 'staging' && 'staging' || 'production')) == 'staging' && 'https://staging.server.duncit.com' || 'https://server.duncit.com' }}
  CI: 1
  EXPO_NO_TELEMETRY: 1
  # Set the moment the IPA is copied out — the failure reporter uses it to tell
  # "build failed" from "reporting failed".
  ARTIFACT_PATHS: ''
  BUILD_STAGE: ''

jobs:
  plan:
    name: Did the CRM app change?
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v5
      - name: Affected app
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/ci-affected.mjs plan --under app/crm-app --extra app/crm-app
          --global .github/workflows/crm-ios-build.yml --global 'server/src/modules/**/*.schema.ts' --global 'server/src/microservices/**/*.schema.ts'

  build:
    needs: plan
    if: always() && (github.event_name == 'workflow_dispatch' || needs.plan.outputs.any == 'true')
    name: Build & publish Duncit CRM IPA
    runs-on: macos-26
    timeout-minutes: 120
    env:
      # A staging push reports to staging when that server's CI token exists;
      # each server signs its own tokens and keeps its own signing identity, so
      # the token follows the URL. The secrets context is unavailable in
      # workflow-level env, which is why this lives on the job.
      REPORT_GRAPHQL_URL: >-
        ${{ inputs.report_url || (github.ref_name == 'staging' && secrets.DUNCIT_RELEASE_TOKEN_STAGING != '' && 'https://staging.server.duncit.com/graphql' || 'https://server.duncit.com/graphql') }}
      REPORT_TOKEN: >-
        ${{ (contains(inputs.report_url, 'staging.') || (inputs.report_url == '' && github.ref_name == 'staging' && secrets.DUNCIT_RELEASE_TOKEN_STAGING != '')) && secrets.DUNCIT_RELEASE_TOKEN_STAGING || secrets.DUNCIT_RELEASE_TOKEN }}
      DISPATCH_ID: ${{ inputs.dispatch_id }}
      REPORT_EMAIL: ${{ secrets.DUNCIT_RELEASE_EMAIL }}
      REPORT_PASSWORD: ${{ secrets.DUNCIT_RELEASE_PASSWORD }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    defaults:
      run:
        working-directory: app/crm-app
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the build number and the report's commit range.
          fetch-depth: 0

      - name: Select the newest release Xcode 26
        # The newest 26.x, never a beta or RC (App Store Connect refuses those).
        # expo-modules-jsi (SDK 57) needs Swift tools 6.2 and a late 26.x
        # compiler — see ios-build.yml's Xcode step for the details.
        run: |
          echo "Installed: $(ls -d /Applications/Xcode_*.app | xargs -n1 basename | tr '\n' ' ')"
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -viE 'beta|_rc|release.?candidate' | sed -e 's#/*$##' -e 's/\.app$//' | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No release Xcode 26 on this runner"
            exit 1
          fi
          DEVELOPER_DIR="$XCODE_APP.app/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          "$DEVELOPER_DIR/usr/bin/xcodebuild" -version
          echo "iOS SDK: $(DEVELOPER_DIR="$DEVELOPER_DIR" xcrun --sdk iphoneos --show-sdk-version)"

      - name: Record build start
        # Build number = commits on this branch, the same counter the Android
        # versionCode uses: it only ever grows, and App Store Connect refuses a
        # build number it has already seen for a version.
        run: |
          {
            echo "BUILD_STARTED_AT=$(date +%s)"
            echo "IOS_BUILD_NUMBER=$(git rev-list --count HEAD)"
          } >> "$GITHUB_ENV"

      - name: Validate App Store request
        if: inputs.submit_to_app_store
        run: |
          if [ "${{ inputs.app_env }}" != "production" ]; then
            echo "::error::App Store submission requires a production build"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/crm-app/package-lock.json

      - name: Report the build as started
        continue-on-error: true
        working-directory: .
        env:
          PLATFORM: IOS
          STATUS: RUNNING
          BUILD_STAGE: Starting up
          DISPATCH_ID: ${{ env.DISPATCH_ID }}
          DUNCIT_GRAPHQL_URL: ${{ env.REPORT_GRAPHQL_URL }}
          DUNCIT_RELEASE_TOKEN: ${{ env.REPORT_TOKEN }}
          DUNCIT_RELEASE_EMAIL: ${{ env.REPORT_EMAIL }}
          DUNCIT_RELEASE_PASSWORD: ${{ env.REPORT_PASSWORD }}
          GIT_BEFORE: ${{ github.event.before }}
        run: node scripts/report-app-build.mjs

      - name: 'Stage: signing identity'
        uses: ./.github/actions/build-stage
        with:
          stage: Installing the signing identity
          platform: IOS
          app: CRM
          dispatch_id: ${{ env.DISPATCH_ID }}
          graphql_url: ${{ env.REPORT_GRAPHQL_URL }}
          release_token: ${{ env.REPORT_TOKEN }}
          release_email: ${{ env.REPORT_EMAIL }}
          release_password: ${{ env.REPORT_PASSWORD }}
          run_url: ${{ env.RUN_URL }}

      - name: Fetch the signing identity
        # First, before any compiling: a missing CRM bundle ID or an expired
        # certificate should cost a minute here, not the hour to the archive.
        working-directory: .
        env:
          DUNCIT_GRAPHQL_URL: ${{ env.REPORT_GRAPHQL_URL }}
          DUNCIT_RELEASE_TOKEN: ${{ env.REPORT_TOKEN }}
          DUNCIT_RELEASE_EMAIL: ${{ env.REPORT_EMAIL }}
          DUNCIT_RELEASE_PASSWORD: ${{ env.REPORT_PASSWORD }}
        run: node scripts/fetch-ios-signing.mjs

      - name: Install the signing identity
        run: |
          APP_BUNDLE_ID=$(node -p "require('./app.json').expo.ios.bundleIdentifier")
          if [ "$IOS_BUNDLE_ID" != "$APP_BUNDLE_ID" ]; then
            echo "::error::The signing files are for $IOS_BUNDLE_ID but app/crm-app/app.json builds $APP_BUNDLE_ID — set the Duncit CRM Bundle ID on Tech → Environment → App Store Connect to match"
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/duncit-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$IOS_P12_PATH" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$IOS_P12_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          echo "IOS_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q '"Apple Distribution'; then
            security find-identity -v -p codesigning "$KEYCHAIN"
            echo "::error::The fetched .p12 holds no valid Apple Distribution identity — generate new signing files in Tech → App Builds → Settings"
            exit 1
          fi

          # Xcode 16 and later read profiles from UserData, not MobileDevice.
          PROFILES_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          cp "$IOS_PROFILE_PATH" "$PROFILES_DIR/$IOS_PROFILE_UUID.mobileprovision"

      - name: 'Stage: install dependencies'
        uses: ./.github/actions/build-stage
        with:
          stage: Installing JS dependencies
          platform: IOS
          app: CRM
          dispatch_id: ${{ env.DISPATCH_ID }}
          graphql_url: ${{ env.REPORT_GRAPHQL_URL }}
          release_token: ${{ env.REPORT_TOKEN }}
          release_email: ${{ env.REPORT_EMAIL }}
          release_password: ${{ env.REPORT_PASSWORD }}
          run_url: ${{ env.RUN_URL }}

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Generate GraphQL types
        # src/generated is gitignored — regenerated from the server schemas in this checkout.
        run: npm run codegen

      - name: 'Stage: prebuild'
        uses: ./.github/actions/build-stage
        with:
          stage: Generating the native iOS project
          platform: IOS
          app: CRM
          dispatch_id: ${{ env.DISPATCH_ID }}
          graphql_url: ${{ env.REPORT_GRAPHQL_URL }}
          release_token: ${{ env.REPORT_TOKEN }}
          release_email: ${{ env.REPORT_EMAIL }}
          release_password: ${{ env.REPORT_PASSWORD }}
          run_url: ${{ env.RUN_URL }}

      - name: Generate the native ios project
        # ios/ is not committed — regenerated from app.json + config plugins.
        # The crm-telephony module is Android only, so autolinking leaves it out.
        run: npx expo prebuild --platform ios --no-install --clean

      - name: 'Stage: pods'
        uses: ./.github/actions/build-stage
        with:
          stage: Installing CocoaPods dependencies
          platform: IOS
          app: CRM
          dispatch_id: ${{ env.DISPATCH_ID }}
          graphql_url: ${{ env.REPORT_GRAPHQL_URL }}
          release_token: ${{ env.REPORT_TOKEN }}
          release_email: ${{ env.REPORT_EMAIL }}
          release_password: ${{ env.REPORT_PASSWORD }}
          run_url: ${{ env.RUN_URL }}

      - name: Install CocoaPods dependencies
        run: npx pod-install ios

      - name: Sign the app target for the App Store
        # Only the APP target: the same settings as xcodebuild arguments would
        # reach every Pods target too, and those refuse a provisioning profile.
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          ruby -rxcodeproj -e '
            project = Xcodeproj::Project.open(ARGV[0])
            app = project.targets.find { |t| t.product_type == "com.apple.product-type.application" }
            abort("No application target in #{ARGV[0]}") unless app
            release = app.build_configurations.find { |c| c.name == "Release" }
            abort("No Release configuration on #{app.name}") unless release
            release.build_settings["CODE_SIGN_STYLE"] = "Manual"
            release.build_settings["DEVELOPMENT_TEAM"] = ENV.fetch("IOS_TEAM_ID")
            release.build_settings["CODE_SIGN_IDENTITY"] = "Apple Distribution"
            release.build_settings["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = "Apple Distribution"
            release.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = ENV.fetch("IOS_PROFILE_NAME")
            project.save
          ' "ios/$SCHEME.xcodeproj"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $IOS_BUILD_NUMBER" "ios/$SCHEME/Info.plist"

      - name: 'Stage: archive'
        uses: ./.github/actions/build-stage
        with:
          stage: Compiling (xcodebuild archive)
          platform: IOS
          app: CRM
          dispatch_id: ${{ env.DISPATCH_ID }}
          graphql_url: ${{ env.REPORT_GRAPHQL_URL }}
          release_token: ${{ env.REPORT_TOKEN }}
          release_email: ${{ env.REPORT_EMAIL }}
          release_password: ${{ env.REPORT_PASSWORD }}
          run_url: ${{ env.RUN_URL }}

      - name: Archive
        run: |
          # -d: an .xcworkspace is a directory, and plain ls lists its contents.
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/duncit-crm.xcarchive" archive

      - name: 'Stage: package'
        uses: ./.github/actions/build-stage
        with:
          stage: Packaging the IPA
          platform: IOS
          app: CRM
          dispatch_id: ${{ env.DISPATCH_ID }}
          graphql_url: ${{ env.REPORT_GRAPHQL_URL }}
          release_token: ${{ env.REPORT_TOKEN }}
          release_email: ${{ env.REPORT_EMAIL }}
          release_password: ${{ env.REPORT_PASSWORD }}
          run_url: ${{ env.RUN_URL }}

      - name: Export the App Store IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$IOS_BUNDLE_ID</key><string>$IOS_PROFILE_UUID</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$PWD/build/duncit-crm.xcarchive" \
            -exportPath "$PWD/build/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Package the IPA
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          ARTIFACT="duncit-crm-ios-v${APP_VERSION}-${SHORT_SHA}.ipa"
          IPA=$(find build/export -maxdepth 1 -name '*.ipa' | head -1)
          cp "$IPA" "$RUNNER_TEMP/$ARTIFACT"
          echo "ARTIFACT_PATHS=$RUNNER_TEMP/$ARTIFACT" >> "$GITHUB_ENV"

      - name: Keep a copy on the run
        # Kept BEFORE the upload is attempted: an hour of macOS runner time is
        # too much to lose to a server the runner cannot reach.
        uses: actions/upload-artifact@v6
        with:
          name: crm-ios-release-${{ github.run_id }}
          path: ${{ runner.temp }}/duncit-crm-ios-*
          if-no-files-found: error
          retention-days: 14

      - name: 'Stage: upload and record'
        uses: ./.github/actions/build-stage
        with:
          stage: Uploading the artifact and recording the build
          platform: IOS
          app: CRM
          dispatch_id: ${{ env.DISPATCH_ID }}
          graphql_url: ${{ env.REPORT_GRAPHQL_URL }}
          release_token: ${{ env.REPORT_TOKEN }}
          release_email: ${{ env.REPORT_EMAIL }}
          release_password: ${{ env.REPORT_PASSWORD }}
          run_url: ${{ env.RUN_URL }}

      - name: Upload the IPA, record the build and announce it on Slack
        working-directory: .
        env:
          PLATFORM: IOS
          DISPATCH_ID: ${{ env.DISPATCH_ID }}
          DUNCIT_GRAPHQL_URL: ${{ env.REPORT_GRAPHQL_URL }}
          DUNCIT_RELEASE_TOKEN: ${{ env.REPORT_TOKEN }}
          DUNCIT_RELEASE_EMAIL: ${{ env.REPORT_EMAIL }}
          DUNCIT_RELEASE_PASSWORD: ${{ env.REPORT_PASSWORD }}
          GIT_BEFORE: ${{ github.event.before }}
        run: node scripts/report-app-build.mjs

      - name: Upload the IPA to App Store Connect
        # LAST, after the build is recorded and the IPA kept twice: Apple
        # refusing an upload must not cost the build itself.
        if: inputs.submit_to_app_store
        run: |
          xcrun altool --upload-app --type ios --file "$ARTIFACT_PATHS" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Remove the signing identity from the runner
        if: always()
        run: |
          if [ -n "$IOS_KEYCHAIN" ]; then security delete-keychain "$IOS_KEYCHAIN"; fi
          rm -rf "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/.appstoreconnect" \
            "$RUNNER_TEMP/duncit-signing.p12" "$RUNNER_TEMP/duncit.mobileprovision"

      - name: Record the failure
        # Only when no IPA was produced — a reporting hiccup on a good build
        # stays a red workflow, not a false "build failed" row.
        if: failure() && env.ARTIFACT_PATHS == ''
        continue-on-error: true
        working-directory: .
        env:
          PLATFORM: IOS
          STATUS: FAILED
          DISPATCH_ID: ${{ env.DISPATCH_ID }}
          DUNCIT_GRAPHQL_URL: ${{ env.REPORT_GRAPHQL_URL }}
          DUNCIT_RELEASE_TOKEN: ${{ env.REPORT_TOKEN }}
          DUNCIT_RELEASE_EMAIL: ${{ env.REPORT_EMAIL }}
          DUNCIT_RELEASE_PASSWORD: ${{ env.REPORT_PASSWORD }}
          GIT_BEFORE: ${{ github.event.before }}
        run: node scripts/report-app-build.mjs
