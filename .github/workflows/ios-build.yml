# iOS IPA on every merge to main, and on demand from Tech → App Builds → Create
# build. Built on a GitHub macOS runner (never the VPS), uploaded through the
# server and recorded via reportAppBuild, which also announces it on the
# configured Slack channel (Tech portal → App Builds → Settings).
#
# There is no artifact choice here, unlike Android: an App Store-signed IPA is
# the only thing this produces, so the only build-time question is `app_env` —
# what the BUILT APP talks to, baked in at compile time. `report_url` is a
# separate question: where the build records itself, always the portal that
# started it.
#
# SIGNED for the App Store, on this runner and nowhere else — no Mac and no EAS
# involved. The signing identity is the server's: Tech → App Builds → Settings
# generates the Apple Distribution certificate and App Store profile through the
# App Store Connect API (key on the APP_STORE_CONNECT env entry), and the job
# fetches them — plus that key — from the server it reports to. They exist here
# only in a throwaway keychain the job deletes. An opted-in dispatch then
# uploads the IPA to App Store Connect (TestFlight) with the same key.
#
# Secrets: DUNCIT_RELEASE_TOKEN (a SUPER_ADMIN / TECH_MANAGER JWT) or
# DUNCIT_RELEASE_EMAIL + DUNCIT_RELEASE_PASSWORD — reports the build AND fetches
# the signing identity. Add DUNCIT_RELEASE_TOKEN_STAGING as well to let the
# staging portal start builds — each server signs its own tokens, so
# production's is not valid there, and each keeps its own signing identity.
name: iOS Build

on:
  push:
    branches: [main]
  # No artifact choice here, unlike Android: a signed IPA is the only thing this
  # workflow produces, so the build-time questions are which stack the app
  # talks to and whether it goes on to App Store Connect.
  workflow_dispatch:
    inputs:
      app_env:
        description: Which server and database the built app talks to
        type: choice
        options: [production, staging]
        default: production
      submit_to_app_store:
        description: Upload the IPA to App Store Connect (TestFlight) after it builds
        type: boolean
        default: false
      dispatch_id:
        description: Set by the Tech portal to claim the row it already created. Leave empty by hand.
        type: string
        default: ''
      report_url:
        description: GraphQL endpoint to record the build in. Empty reports to production.
        type: string
        default: ''

# Never kill a running build. GitHub still keeps only the NEWEST queued run per
# group, so a merge landing mid-build can be superseded — the reporter closes
# that changelog gap by ranging from the last build the server recorded.
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Baked into the binary at compile time, which is why it is a build-time
  # choice and not a setting in the app. A push to main always means production;
  # only an explicit dispatch can ask for staging.
  EXPO_PUBLIC_API_URL: >-
    ${{ inputs.app_env == 'staging' && 'https://staging.server.duncit.com' || 'https://server.duncit.com' }}
  # WHERE the build records itself, which is deliberately NOT the same question
  # as which server its app talks to: a build always reports to the portal that
  # started it, so a staging-pointed build triggered from production is still
  # visible in production.
  REPORT_GRAPHQL_URL: ${{ inputs.report_url || 'https://server.duncit.com/graphql' }}
  CI: 1
  EXPO_NO_TELEMETRY: 1
  CYPRESS_INSTALL_BINARY: 0
  # Set (via GITHUB_ENV) the moment the packaged IPA is copied out — the failure
  # reporter uses it to tell "build failed" from "reporting failed".
  ARTIFACT_PATHS: ''
  # What the job is doing, rewritten by a marker step before each long stage.
  # A value written to GITHUB_ENV lands on the NEXT step, which is exactly what
  # makes this work: the marker names the step that follows it, so whatever
  # BUILD_STAGE holds when the job dies is the stage that actually broke.
  BUILD_STAGE: ''

jobs:
  build:
    name: Build & publish IPA
    runs-on: macos-26
    timeout-minutes: 120
    env:
      # Each server signs its own tokens, so a production JWT is not valid on
      # staging. Picking the secret from where the build reports is what lets a
      # staging portal start builds at all. The secrets context is unavailable
      # in workflow-level env, which is why this lives on the job.
      REPORT_TOKEN: >-
        ${{ contains(inputs.report_url, 'staging.') && secrets.DUNCIT_RELEASE_TOKEN_STAGING || secrets.DUNCIT_RELEASE_TOKEN }}
      REPORT_EMAIL: ${{ secrets.DUNCIT_RELEASE_EMAIL }}
      REPORT_PASSWORD: ${{ secrets.DUNCIT_RELEASE_PASSWORD }}
      DISPATCH_ID: ${{ inputs.dispatch_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    defaults:
      run:
        working-directory: app/mobile-app
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the report step describes the merged commit range.
          fetch-depth: 0

      - name: Select the newest Xcode 26
        # Two separate constraints, both from expo-modules-jsi (SDK 57), and
        # only the newest 26.x satisfies both:
        #
        #  - `apple/Package.swift` declares `swift-tools-version: 6.2`, so
        #    Xcode 16.4 (the macos-15 default, Swift 6.1) cannot even resolve
        #    it: "package 'apple' is using Swift tools version 6.2.0 but the
        #    installed version is 6.1.0".
        #  - 57.0.5 annotated both RuntimeScheduler constructors
        #    SWIFT_RETURNS_RETAINED to silence Xcode 27 ownership warnings, and
        #    Xcode 26.3 and older reject that annotation on a constructor as a
        #    hard error ("not returning a SWIFT_SHARED_REFERENCE type"). Only
        #    the late 26.x compilers accept it, which is why this runs on
        #    macos-26 (Xcode 26.4.1 through 26.6) and not macos-15, whose
        #    newest is the 26.3 that fails.
        #
        # Newest rather than a pinned minor: the image rotates those, and an
        # empty glob fails the version call here instead of 20 minutes into the
        # archive.
        run: |
          DEVELOPER_DIR=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)/Contents/Developer
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          "$DEVELOPER_DIR/usr/bin/xcodebuild" -version

      - name: Record build start
        run: |
          NOW=$(date +%s)
          {
            echo "BUILD_STARTED_AT=$NOW"
            # App Store Connect refuses a build number it has already seen.
            # Seconds since 2020 are monotonic and replace the CFBundleVersion 1
            # that Expo prebuild otherwise writes every run — the same clock
            # the Android versionCode uses.
            echo "IOS_BUILD_NUMBER=$((NOW - 1577836800))"
          } >> "$GITHUB_ENV"

      - name: Validate App Store request
        if: inputs.submit_to_app_store
        run: |
          if [ "${{ inputs.app_env }}" != "production" ]; then
            echo "::error::App Store submission requires a production build"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/mobile-app/package-lock.json

      - name: Report the build as started
        # Opens the row the Tech portal shows spinning, so a build is visible
        # while it is being made rather than only 15 minutes later. Best-effort
        # on purpose: a build must not be abandoned because the table could not
        # be told it began — the final report is the one that fails loudly.
        continue-on-error: true
        working-directory: .
        env:
          PLATFORM: IOS
          STATUS: RUNNING
          BUILD_STAGE: Starting up
          DISPATCH_ID: ${{ env.DISPATCH_ID }}
          DUNCIT_GRAPHQL_URL: ${{ env.REPORT_GRAPHQL_URL }}
          DUNCIT_RELEASE_TOKEN: ${{ env.REPORT_TOKEN }}
          DUNCIT_RELEASE_EMAIL: ${{ env.REPORT_EMAIL }}
          DUNCIT_RELEASE_PASSWORD: ${{ env.REPORT_PASSWORD }}
          GIT_BEFORE: ${{ github.event.before }}
          RUN_URL: ${{ env.RUN_URL }}
        run: node scripts/report-app-build.mjs

      - name: 'Stage: signing identity'
        uses: ./.github/actions/build-stage
        with:
          stage: Installing the signing identity
          platform: IOS
          dispatch_id: ${{ env.DISPATCH_ID }}
          graphql_url: ${{ env.REPORT_GRAPHQL_URL }}
          release_token: ${{ env.REPORT_TOKEN }}
          release_email: ${{ env.REPORT_EMAIL }}
          release_password: ${{ env.REPORT_PASSWORD }}
          run_url: ${{ env.RUN_URL }}

      - name: Fetch the signing identity
        # First, before any compiling: missing or expired signing files should
        # cost a minute here, not the hour it takes to reach the archive. The
        # identity comes from the server the build reports to — generated in
        # Tech → App Builds → Settings with the App Store Connect key on the
        # APP_STORE_CONNECT env entry — so nothing Apple-issued lives in GitHub.
        working-directory: .
        env:
          DUNCIT_GRAPHQL_URL: ${{ env.REPORT_GRAPHQL_URL }}
          DUNCIT_RELEASE_TOKEN: ${{ env.REPORT_TOKEN }}
          DUNCIT_RELEASE_EMAIL: ${{ env.REPORT_EMAIL }}
          DUNCIT_RELEASE_PASSWORD: ${{ env.REPORT_PASSWORD }}
        run: node scripts/fetch-ios-signing.mjs

      - name: Install the signing identity
        run: |
          APP_BUNDLE_ID=$(node -p "require('./app.json').expo.ios.bundleIdentifier")
          if [ "$IOS_BUNDLE_ID" != "$APP_BUNDLE_ID" ]; then
            echo "::error::The signing files are for $IOS_BUNDLE_ID but app.json builds $APP_BUNDLE_ID — fix the bundle ID on the App Store Connect env entry and generate again"
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/duncit-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$IOS_P12_PATH" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$IOS_P12_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          echo "IOS_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q '"Apple Distribution'; then
            security find-identity -v -p codesigning "$KEYCHAIN"
            echo "::error::The fetched .p12 holds no valid Apple Distribution identity — generate new signing files in Tech → App Builds → Settings"
            exit 1
          fi

          # Xcode 16 and later read profiles from UserData, not MobileDevice.
          PROFILES_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          cp "$IOS_PROFILE_PATH" "$PROFILES_DIR/$IOS_PROFILE_UUID.mobileprovision"

      - name: 'Stage: install dependencies'
        uses: ./.github/actions/build-stage
        with:
          stage: Installing JS dependencies
          platform: IOS
          dispatch_id: ${{ env.DISPATCH_ID }}
          graphql_url: ${{ env.REPORT_GRAPHQL_URL }}
          release_token: ${{ env.REPORT_TOKEN }}
          release_email: ${{ env.REPORT_EMAIL }}
          release_password: ${{ env.REPORT_PASSWORD }}
          run_url: ${{ env.RUN_URL }}

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: 'Stage: codegen'
        uses: ./.github/actions/build-stage
        with:
          stage: Generating GraphQL types
          platform: IOS
          dispatch_id: ${{ env.DISPATCH_ID }}
          graphql_url: ${{ env.REPORT_GRAPHQL_URL }}
          release_token: ${{ env.REPORT_TOKEN }}
          release_email: ${{ env.REPORT_EMAIL }}
          release_password: ${{ env.REPORT_PASSWORD }}
          run_url: ${{ env.RUN_URL }}

      - name: Generate GraphQL types
        # src/generated is gitignored — regenerated from the server schemas in this checkout.
        run: npm run codegen

      - name: 'Stage: prebuild'
        uses: ./.github/actions/build-stage
        with:
          stage: Generating the native iOS project
          platform: IOS
          dispatch_id: ${{ env.DISPATCH_ID }}
          graphql_url: ${{ env.REPORT_GRAPHQL_URL }}
          release_token: ${{ env.REPORT_TOKEN }}
          release_email: ${{ env.REPORT_EMAIL }}
          release_password: ${{ env.REPORT_PASSWORD }}
          run_url: ${{ env.RUN_URL }}

      - name: Generate the native ios project
        # ios/ is gitignored (CNG) — regenerated from app.json + config plugins.
        run: npx expo prebuild --platform ios --no-install --clean

      - name: 'Stage: pods'
        uses: ./.github/actions/build-stage
        with:
          stage: Installing CocoaPods dependencies
          platform: IOS
          dispatch_id: ${{ env.DISPATCH_ID }}
          graphql_url: ${{ env.REPORT_GRAPHQL_URL }}
          release_token: ${{ env.REPORT_TOKEN }}
          release_email: ${{ env.REPORT_EMAIL }}
          release_password: ${{ env.REPORT_PASSWORD }}
          run_url: ${{ env.RUN_URL }}

      - name: Install CocoaPods dependencies
        run: npx pod-install ios

      - name: Sign the app target for the App Store
        # ios/ is regenerated every run, so signing is set here rather than in a
        # committed project. Only the APP target changes: the same settings as
        # xcodebuild arguments would reach every Pods target too, and those
        # refuse a provisioning profile ("does not support provisioning
        # profiles"). xcodeproj is the gem CocoaPods itself edits projects with.
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          ruby -rxcodeproj -e '
            project = Xcodeproj::Project.open(ARGV[0])
            app = project.targets.find { |t| t.product_type == "com.apple.product-type.application" }
            abort("No application target in #{ARGV[0]}") unless app
            release = app.build_configurations.find { |c| c.name == "Release" }
            abort("No Release configuration on #{app.name}") unless release
            release.build_settings["CODE_SIGN_STYLE"] = "Manual"
            release.build_settings["DEVELOPMENT_TEAM"] = ENV.fetch("IOS_TEAM_ID")
            release.build_settings["CODE_SIGN_IDENTITY"] = "Apple Distribution"
            release.build_settings["CODE_SIGN_IDENTITY[sdk=iphoneos*]"] = "Apple Distribution"
            release.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = ENV.fetch("IOS_PROFILE_NAME")
            project.save
          ' "ios/$SCHEME.xcodeproj"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $IOS_BUILD_NUMBER" "ios/$SCHEME/Info.plist"

      - name: 'Stage: archive'
        uses: ./.github/actions/build-stage
        with:
          stage: Compiling (xcodebuild archive)
          platform: IOS
          dispatch_id: ${{ env.DISPATCH_ID }}
          graphql_url: ${{ env.REPORT_GRAPHQL_URL }}
          release_token: ${{ env.REPORT_TOKEN }}
          release_email: ${{ env.REPORT_EMAIL }}
          release_password: ${{ env.REPORT_PASSWORD }}
          run_url: ${{ env.RUN_URL }}

      - name: Archive
        run: |
          # -d is load-bearing: an .xcworkspace is a DIRECTORY, and plain `ls`
          # on a directory lists what is inside it. That resolved the workspace
          # to its own `contents.xcworkspacedata` and xcodebuild failed with
          # "'contents.xcworkspacedata' does not exist" — naming the file it was
          # handed, never the glob that produced it.
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/duncit.xcarchive" archive

      - name: 'Stage: package'
        uses: ./.github/actions/build-stage
        with:
          stage: Packaging the IPA
          platform: IOS
          dispatch_id: ${{ env.DISPATCH_ID }}
          graphql_url: ${{ env.REPORT_GRAPHQL_URL }}
          release_token: ${{ env.REPORT_TOKEN }}
          release_email: ${{ env.REPORT_EMAIL }}
          release_password: ${{ env.REPORT_PASSWORD }}
          run_url: ${{ env.RUN_URL }}

      - name: Export the App Store IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$IOS_BUNDLE_ID</key><string>$IOS_PROFILE_UUID</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$PWD/build/duncit.xcarchive" \
            -exportPath "$PWD/build/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Package the IPA
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          ARTIFACT="duncit-ios-v${APP_VERSION}-${SHORT_SHA}.ipa"
          IPA=$(find build/export -maxdepth 1 -name '*.ipa' | head -1)
          cp "$IPA" "$RUNNER_TEMP/$ARTIFACT"
          echo "ARTIFACT_PATHS=$RUNNER_TEMP/$ARTIFACT" >> "$GITHUB_ENV"

      - name: Keep a copy on the run
        # Until the next step stores it, this runner holds the ONLY copy of the
        # IPA, and reaching the server from here is not something the build
        # controls: runs have died with every request to server.duncit.com
        # timing out at the TCP connect, for the whole life of the job, while
        # the same host answered everyone else — a source-address block, which
        # no amount of retrying inside the job can outlast. An hour of macOS
        # runner time is far too much to lose to that, so the artifact is kept
        # here BEFORE the upload is attempted and survives it either way.
        uses: actions/upload-artifact@v6
        with:
          name: ios-release-${{ github.run_id }}
          path: ${{ runner.temp }}/duncit-ios-*
          if-no-files-found: error
          retention-days: 14

      - name: 'Stage: upload and record'
        uses: ./.github/actions/build-stage
        with:
          stage: Uploading the artifact and recording the build
          platform: IOS
          dispatch_id: ${{ env.DISPATCH_ID }}
          graphql_url: ${{ env.REPORT_GRAPHQL_URL }}
          release_token: ${{ env.REPORT_TOKEN }}
          release_email: ${{ env.REPORT_EMAIL }}
          release_password: ${{ env.REPORT_PASSWORD }}
          run_url: ${{ env.RUN_URL }}

      - name: Upload the artifact & record the build
        working-directory: .
        env:
          PLATFORM: IOS
          DISPATCH_ID: ${{ env.DISPATCH_ID }}
          DUNCIT_GRAPHQL_URL: ${{ env.REPORT_GRAPHQL_URL }}
          DUNCIT_RELEASE_TOKEN: ${{ env.REPORT_TOKEN }}
          DUNCIT_RELEASE_EMAIL: ${{ env.REPORT_EMAIL }}
          DUNCIT_RELEASE_PASSWORD: ${{ env.REPORT_PASSWORD }}
          GIT_BEFORE: ${{ github.event.before }}
          RUN_URL: ${{ env.RUN_URL }}
        run: node scripts/report-app-build.mjs

      - name: Upload the IPA to App Store Connect
        # LAST, after the build is recorded and the IPA kept twice: Apple
        # refusing an upload must not cost the build itself. It turns the
        # workflow red; the row stays the honest record of what was built.
        # altool finds the key by name under ~/.appstoreconnect/private_keys,
        # where the signing fetch already wrote it with the key and issuer ids.
        if: inputs.submit_to_app_store
        run: |
          xcrun altool --upload-app --type ios --file "$ARTIFACT_PATHS" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Remove the signing identity from the runner
        if: always()
        run: |
          if [ -n "$IOS_KEYCHAIN" ]; then security delete-keychain "$IOS_KEYCHAIN"; fi
          rm -rf "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/.appstoreconnect" \
            "$RUNNER_TEMP/duncit-signing.p12" "$RUNNER_TEMP/duncit.mobileprovision"

      - name: Record the failure
        # Only when no IPA was produced (ARTIFACT_PATHS is set right after the
        # build) — a reporting/upload hiccup on a good build must stay a red
        # workflow, not a false ':x: build failed' row and Slack alarm. That
        # leaves the RUNNING row standing in the one case where the reporter
        # itself is broken, which is honest: nothing it said could be trusted.
        # continue-on-error so a reporting hiccup never hides the real failure.
        if: failure() && env.ARTIFACT_PATHS == ''
        continue-on-error: true
        working-directory: .
        env:
          PLATFORM: IOS
          STATUS: FAILED
          DISPATCH_ID: ${{ env.DISPATCH_ID }}
          DUNCIT_GRAPHQL_URL: ${{ env.REPORT_GRAPHQL_URL }}
          DUNCIT_RELEASE_TOKEN: ${{ env.REPORT_TOKEN }}
          DUNCIT_RELEASE_EMAIL: ${{ env.REPORT_EMAIL }}
          DUNCIT_RELEASE_PASSWORD: ${{ env.REPORT_PASSWORD }}
          GIT_BEFORE: ${{ github.event.before }}
          RUN_URL: ${{ env.RUN_URL }}
        run: node scripts/report-app-build.mjs
