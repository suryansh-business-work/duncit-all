name: Portals CI

# Every console, grouped into four shard jobs, with the same ordered pipeline:
#   Test → Typecheck → Lint → Build
# (Replaces the old "Form Tests" workflow, which only ran vitest + a separate
# typecheck job for the same set.)
on:
  push:
    branches: [main, master, develop, staging]
    paths:
      - 'portals/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/portals-ci.yml'
  # No `main` here: a PR into main is the staging tip (rule 32), which the push
  # run above already checks on the same commit — listing it ran every job twice.
  pull_request:
    branches: [master, develop, staging]
    paths:
      - 'portals/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/portals-ci.yml'
  workflow_dispatch:

concurrency:
  group: portals-ci-${{ github.ref }}
jobs:
  # Four shards, not one runner per portal. Each portal's real work (typecheck,
  # lint, build) is about a minute, but every runner also pays a full workspace
  # install and a wait in the shared runner queue — 28 of them per push is what
  # kept every other workflow queued. Each shard checks all of its portals and
  # fails at the end with the list, so one red portal never hides another.
  portal:
    name: Portals ${{ matrix.shard.name }} (typecheck → lint → build)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: '1/4'
            dirs: portals/admin portals/finance portals/hr portals/support portals/challenge-portal portals/hosts portals/analytics
          - name: '2/4'
            dirs: portals/tech portals/ads-portal portals/legal portals/website-app portals/developers portals/pods portals/ecomm-portal
          - name: '3/4'
            dirs: portals/partners-app portals/marketing portals/employee portals/regional-club-admin portals/clubs portals/communications portals/localization
          - name: '4/4'
            dirs: portals/crm portals/products portals/onboarding portals/ai portals/venues portals/club-admins portals/logs

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Vitest is not run here: sonar.yml runs every portal's suite on the same
      # push and fails on any test file outside scripts/test-failure-baseline.json.
      #
      # Lint runs the portal's script when one is defined (no-op otherwise),
      # so wiring ESLint later needs no workflow change.
      - name: Typecheck → lint → build
        shell: bash
        run: |
          failed=()
          for dir in ${{ matrix.shard.dirs }}; do
            echo "::group::$dir"
            if (cd "$dir" && pnpm exec tsc -b --noEmit && pnpm run --if-present lint && pnpm run build); then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::$dir failed typecheck, lint or build"
              failed+=("$dir")
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "Failed: ${failed[*]}"
            exit 1
          fi
