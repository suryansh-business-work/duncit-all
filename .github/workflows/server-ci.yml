name: Server CI

# The GraphQL API server, with the same ordered pipeline as every other group:
#   Test → Typecheck → Lint → Build
on:
  push:
    branches: [main, master, develop, staging]
    paths:
      - 'server/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/server-ci.yml'
  pull_request:
    branches: [main, master, develop, staging]
    paths:
      - 'server/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/server-ci.yml'
  workflow_dispatch:

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (test → typecheck → lint → build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Pinned so the cache key below is stable and every run resolves the same
      # mongod. Left unset, mongodb-memory-server picks a version at runtime and
      # the cache would miss on any upstream release.
      MONGOMS_VERSION: 7.0.14
      MONGOMS_DOWNLOAD_DIR: ~/.cache/mongodb-binaries
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # test/global-setup.ts calls MongoMemoryServer.create(), which downloads a
      # mongod binary from fastdl.mongodb.org on a cold runner. Nothing cached
      # it, so every run depended on that fetch succeeding — and when the runner
      # could not reach external registries the job failed at ~4 minutes with a
      # bare "exit code 1", while the identical suite passed locally off a warm
      # cache. Pinning the version keeps the cache key stable.
      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: mongo-binaries-${{ runner.os }}-${{ env.MONGOMS_VERSION }}
          restore-keys: mongo-binaries-${{ runner.os }}-

      # Unit + integration + e2e suites against the in-memory Mongo. Serial
      # (--runInBand): the suites share that instance and flake in parallel.
      - name: Test (jest --runInBand)
        working-directory: server
        run: pnpm run test:ci

      - name: Typecheck
        working-directory: server
        run: pnpm exec tsc --noEmit -p tsconfig.json

      # Runs the package's lint script when one is defined (no-op otherwise),
      # so wiring ESLint later needs no workflow change.
      - name: Lint
        working-directory: server
        run: pnpm run --if-present lint

      - name: Build (tsc + tsc-alias)
        working-directory: server
        run: pnpm run build
