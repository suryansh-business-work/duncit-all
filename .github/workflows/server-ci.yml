name: Server CI

# The GraphQL API server, with the same ordered pipeline as every other group:
#   Test → Typecheck → Lint → Build
on:
  push:
    branches: [main, master, develop, staging]
    paths:
      - 'server/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/server-ci.yml'
  # No `main` here: a PR into main is the staging tip (rule 32), which the push
  # run above already checks on the same commit — listing it ran every job twice.
  pull_request:
    branches: [master, develop, staging]
    paths:
      - 'server/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/server-ci.yml'
  workflow_dispatch:

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (test → typecheck → lint → build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No jest step here: sonar.yml's "Coverage — server" runs the identical
      # `test:coverage` suite on every staging push, and this copy could not
      # fail the job anyway (the `| tee` pipe had no pipefail). It cost ~10
      # serial minutes per push for a result nothing read.

      - name: Typecheck
        working-directory: server
        run: pnpm exec tsc --noEmit -p tsconfig.json

      # Builds the executable schema exactly as the server does at boot, so a
      # duplicated or dangling field fails here instead of crash-looping the
      # deployed container (what took production down on 2026-09-08).
      - name: Schema gate
        working-directory: server
        run: pnpm run check:schema

      # Runs the package's lint script when one is defined (no-op otherwise),
      # so wiring ESLint later needs no workflow change.
      - name: Lint
        working-directory: server
        run: pnpm run --if-present lint

      - name: Build (tsc + tsc-alias)
        working-directory: server
        run: pnpm run build
