name: Server CI

# The GraphQL API server, with the same ordered pipeline as every other group:
#   Test → Typecheck → Lint → Build
on:
  push:
    branches: [main, master, develop, staging]
    paths:
      - 'server/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/server-ci.yml'
  pull_request:
    branches: [main, master, develop, staging]
    paths:
      - 'server/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/server-ci.yml'
  workflow_dispatch:

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (test → typecheck → lint → build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Pinned so the cache key below is stable and every run resolves the same
      # mongod. Left unset, mongodb-memory-server picks a version at runtime and
      # the cache would miss on any upstream release.
      MONGOMS_VERSION: 7.0.14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # test/global-setup.ts calls MongoMemoryServer.create(), which downloads a
      # mongod binary from fastdl.mongodb.org on a cold runner.
      #
      # MONGOMS_DOWNLOAD_DIR must be set HERE, not in the job's `env:` block:
      # Actions does not shell-expand values, and mongodb-memory-server feeds
      # the value straight to path.resolve() (DryMongoBinary.generatePaths), so
      # a literal "~/.cache/..." lands in "<cwd>/~/.cache/..." — inside server/,
      # not the home directory actions/cache saves. The two never met and the
      # cache could never hit. Deriving both from $HOME keeps them one path.
      - name: Resolve the mongod cache directory
        run: echo "MONGOMS_DOWNLOAD_DIR=$HOME/.cache/mongodb-binaries" >> "$GITHUB_ENV"

      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: mongo-binaries-${{ runner.os }}-${{ env.MONGOMS_VERSION }}
          restore-keys: mongo-binaries-${{ runner.os }}-

      # Unit + integration + e2e suites against the in-memory Mongo. Serial
      # (--runInBand): the suites share that instance and flake in parallel.
      - name: Test (jest --runInBand)
        id: test
        working-directory: server
        # `tee` keeps the output for the annotation step below. The runner's
        # default shell already sets `-o pipefail`, so jest's exit code is still
        # the step's exit code and nothing here can mask a failure.
        run: pnpm run test:ci 2>&1 | tee jest.log

      # A failed step used to surface only "Process completed with exit code 1".
      # Step logs need a token to read, so that bare line was the whole public
      # record of the failure. This republishes the actual jest failures as
      # annotations and a job summary, which the run page and the public
      # check-runs API both serve.
      - name: Report the failing tests
        if: failure() && steps.test.outcome == 'failure'
        working-directory: server
        run: node scripts/ci-jest-annotations.mjs jest.log

      - name: Typecheck
        working-directory: server
        run: pnpm exec tsc --noEmit -p tsconfig.json

      # Runs the package's lint script when one is defined (no-op otherwise),
      # so wiring ESLint later needs no workflow change.
      - name: Lint
        working-directory: server
        run: pnpm run --if-present lint

      - name: Build (tsc + tsc-alias)
        working-directory: server
        run: pnpm run build
