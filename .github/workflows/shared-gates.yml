name: Shared Gates

# The two compile-time contracts in CLAUDE.md rules 38 + 39 are enforced by
# plain node scripts. They were chained into `pnpm test` of the packages that
# own them, but NOTHING in CI runs a packages/* `test` script — the only
# recursive invocation is sonar.yml's `test:coverage`, and that fires on `main`
# only. So both gates were passing by never running.
#
# This job runs them directly, on every push and PR, with no path filter: the
# bundles are shared, so a change anywhere can violate them.
on:
  push:
    branches: [main, master, develop, staging]
  pull_request:
    branches: [main, master, develop, staging]
  workflow_dispatch:

concurrency:
  group: shared-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Shared gates (fallback icons + localization)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Rule 39: every surface ships a local copy of every fallback icon name.
      - name: Fallback icons — mWeb
        run: node scripts/verify-fallback-icons.mjs app/mweb/src/fallback-icons

      - name: Fallback icons — native app
        run: node scripts/verify-fallback-icons.mjs app/mobile-app/assets/fallback-icons

      - name: Fallback icons — portal shell (all 17 portals)
        run: node scripts/verify-fallback-icons.mjs packages/shell/src/fallback-icons

      # Rule 38, both directions: no shipped key that nothing renders, and no
      # rendered key that nothing ships (the latter prints the raw key on screen).
      - name: Translation keys match the bundles
        run: node scripts/verify-translation-keys.mjs .

      # Rule 38, the ratchet: the hardcoded-copy backlog may shrink, never grow.
      - name: No new hardcoded user-facing copy
        run: node scripts/verify-hardcoded-copy.mjs .

      # The server seeds Localization on boot from a GENERATED copy of the
      # bundles (it takes no @duncit/* dependency). A stale copy would seed
      # yesterday's keys and nothing would say so.
      - name: Shipped keys match the bundles
        run: node scripts/generate-shipped-keys.mjs --check

      # Every shared package ships a runnable demo the Tech portal renders under
      # Package Documentation. The registry indexing them is generated, so a demo
      # added without regenerating is a file nothing loads — an empty Live demos
      # tab, which reads as "this package has nothing to show" rather than as a
      # mistake. Same contract as the shipped-keys check above.
      - name: Package demo registry matches the demos on disk
        run: node scripts/generate-demo-registry.mjs --check

  # ---------------------------------------------------------------------------
  # The shared packages hold the code every surface depends on, and until now no
  # CI job ran their suites at all — apps-ci, portals-ci and websites-ci are each
  # scoped to their own matrix, and sonar.yml's recursive run fires on `main`
  # only AND swallows failures with continue-on-error. Nine tests were sitting
  # broken on staging (pod-form x2, user-context x7) with every check green.
  #
  # These thresholds are the packages' own — this job only makes them count.
  # ---------------------------------------------------------------------------
  packages:
    name: Shared packages (tests + coverage thresholds + docs)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # TEST PAUSE (temporary — see the banner at the top of .claude/CLAUDE.md).
      # The two compile-time gates above (fallback icons, translation keys) are
      # NOT tests and stay on; only the package suites are paused.
      #
      # No --no-bail and no continue-on-error: a package that misses its own
      # declared threshold must fail the build, which is the whole point.
      #
      # --workspace-concurrency=1 because running ~26 vitest instances at once,
      # each with its own worker pool, intermittently killed the runner with
      # "FATAL ERROR: v8::ToLocalChecked Empty MaybeLocal" — a V8 OOM, not a test
      # failure. It was reproducible only by luck: the same commit passed on the
      # push event and failed on the pull_request event. Serialising costs a
      # little wall-clock on a gate that is nowhere near the critical path, and
      # buys a signal that means what it says.
      # - name: Package suites + coverage thresholds
      #   run: pnpm --workspace-concurrency=1 --filter "./packages/**" --if-present test:coverage

      # The docs site reads packages/*/docs/index.mdx through a strict content
      # collection, so this is also what validates that frontmatter. Without it
      # a malformed doc only breaks for whoever next runs `pnpm docs`.
      - name: Docs site builds
        run: pnpm --filter duncit-docs build

      # A gql template is an opaque string to tsc AND to Vite, and the portals
      # parse it at module load — so a malformed document type-checks, builds,
      # ships, and throws in the browser console with a minified stack. This
      # lives HERE rather than in the gates job above because it needs a real
      # GraphQL parser, and that job installs nothing on purpose.
      - name: GraphQL documents parse
        run: node scripts/verify-gql-documents.mjs

      # Parsing is not enough. A document that parses can still ask for a field
      # the schema does not have, or pass an argument by the wrong name — both
      # green above, both a runtime error in the browser. This validates every
      # resolvable client document AGAINST the schema the server boots with.
      # It found `publicUsersByIds(ids:)` on a live mWeb page, where the schema
      # has always wanted `user_ids`. Static like its sibling: an earlier version
      # imported the server module graph and failed here while passing locally,
      # because nothing in CI had ever imported it.
      - name: GraphQL documents match the schema
        run: node scripts/verify-gql-schema.mjs

      # The Ask Bot's navigation map is prose, so tsc sees nothing wrong with a
      # page whose surface key is misspelt — and the link resolver drops exactly
      # those, leaving the bot answering confidently with no link at all. This
      # checks every page resolves, every surface has pages, and each surface's
      # local / staging / production address is built the way it should be.
      - name: Ask Bot navigation map is consistent
        run: pnpm --filter server check:askbot

      # Every AI feature reads its prompt from the library at call time, so a
      # catalogue mistake is silent: a declared variable the body never uses
      # sends the model a question with the fact missing, a placeholder nothing
      # declares reaches it as literal braces, and a key dropped from the
      # catalogue makes the boot seed delete an operator's edited row. All prose
      # to tsc, all invisible until somebody reads a bad answer.
      - name: AI prompt catalogue is consistent
        run: pnpm --filter server check:prompts
