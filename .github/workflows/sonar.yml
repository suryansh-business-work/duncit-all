name: SonarQube Scan

on:
  push:
    branches:
      - main
      # `staging` is where rule 32 says everything is verified before it reaches
      # main, so scanning only main meant the gate could not be checked until
      # after the merge that was supposed to depend on it. This is the same
      # thing the workflow_dispatch escape hatch below was added to do by hand.
      # SonarQube Community has no branch analysis, so a staging scan replaces
      # the project's single analysis — which is the intent: staging is what is
      # about to become main. The concurrency group above cancels a superseded
      # scan, so a burst of staging pushes still costs one run.
      - staging
  # Run it by hand from the Actions tab ("Run workflow") against ANY branch —
  # the automatic scan only fires on main, so without this a staging cleanup is
  # invisible in SonarQube until it is merged.
  workflow_dispatch:
    inputs:
      fail_on_unreachable:
        description: 'Fail the run (instead of skipping) if the SonarQube server is down'
        type: boolean
        default: false
      skip_coverage:
        description: 'Skip the test runs and scan without coverage (much faster; use only for a quick issue check)'
        type: boolean
        default: false

# A scan takes ~30 minutes; staging takes a push every few minutes. Cancelling
# the run in flight meant EVERY scan died before it could publish — of one
# afternoon's 15 runs, 11 read `cancelled` and none succeeded, so the gate kept
# serving a stale analysis and no fix could ever be seen by it. Queue instead:
# GitHub holds at most ONE pending run per group and cancels the older pending
# one, so a burst of pushes still costs one running + one queued scan — but the
# run already half-way through is allowed to finish and publish.
concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Is the server even up? It is a manually-managed VPS container; when it is
  # down the scanner returns 502 and fails the pipeline for no good reason.
  # ---------------------------------------------------------------------------
  probe:
    name: Probe SonarQube
    runs-on: ubuntu-latest
    outputs:
      up: ${{ steps.sonar.outputs.up }}
    steps:
      - name: Check SonarQube availability
        id: sonar
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "${{ secrets.SONAR_HOST_URL }}/api/server/version" || echo "000")
          if [ "$code" = "200" ]; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "up=false" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.fail_on_unreachable }}" = "true" ]; then
              echo "::error::SonarQube server unreachable (HTTP $code)."
              exit 1
            fi
            echo "::warning::SonarQube server unreachable (HTTP $code) — skipping scan."
          fi

  # ---------------------------------------------------------------------------
  # Coverage. The scanner NEVER runs tests — it only reads the lcov each runner
  # writes (sonar.javascript.lcov.reportPaths). Without these the gate sees 0%
  # and fails new_coverage no matter how good the suites are.
  #
  # ONE JOB PER BIG WORKSPACE, in a matrix. The history of this step is a
  # history of time boxes that were too coarse: one recursive run (a hang sank
  # everything), then five groups (all 17 portals shared one 25-minute budget),
  # then one workspace at a time with 8 minutes each (mweb's 190 suites and the
  # server's jest run need far more than that). Each matrix entry now has its
  # own runner, its own 75-minute budget and its own artifact, so the biggest
  # suites finish in parallel and a failure in one can only ever cost itself.
  # The small workspaces still run sequentially inside their group, each
  # time-boxed, because none of them is big enough to be worth a runner.
  # ---------------------------------------------------------------------------
  coverage-workspaces:
    name: Coverage — ${{ matrix.group.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: probe
    if: needs.probe.outputs.up == 'true' && !inputs.skip_coverage
    strategy:
      fail-fast: false
      matrix:
        group:
          # Big suites: a runner each. Filters are pnpm --filter selectors.
          - { name: server, filters: './server' }
          - { name: mweb, filters: './app/mweb' }
          - { name: admin, filters: './portals/admin' }
          - { name: crm, filters: './portals/crm' }
          - { name: partners-app, filters: './portals/partners-app' }
          - { name: tech, filters: './portals/tech' }
          - { name: finance, filters: './portals/finance' }
          - { name: marketing, filters: './portals/marketing' }
          - { name: onboarding, filters: './portals/onboarding' }
          - { name: products, filters: './portals/products' }
          # Everything else, grouped. Listed explicitly (not "./portals/**")
          # so a big portal is never accidentally run twice or squeezed in here.
          - { name: packages, filters: './packages/**' }
          - { name: small-portals, filters: './portals/support ./portals/ads-portal ./portals/ai ./portals/challenge-portal ./portals/developers ./portals/employee ./portals/hr ./portals/legal ./portals/website-app' }
          - { name: websites, filters: './website/**' }
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A workspace whose OWN threshold is unmet must not veto the scan:
      # challenge-portal's 100%-line target needs its Cypress e2e coverage merged
      # in, which does not happen here. The lcov is written either way, and the
      # quality gate — not a local threshold — is what judges us.
      - name: Run coverage
        continue-on-error: true
        run: |
          set +e
          # Resolve the group's filters to workspace names through pnpm itself,
          # so a new package under ./packages is picked up with no edit here.
          args=()
          for f in ${{ matrix.group.filters }}; do args+=(--filter "$f"); done
          mapfile -t WORKSPACES < <(pnpm list -r --depth -1 --json "${args[@]}" |
            node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              for (const w of JSON.parse(s)) if (w.path && w.name) console.log(w.name);
            })')
          echo "group ${{ matrix.group.name }}: ${#WORKSPACES[@]} workspace(s): ${WORKSPACES[*]}"
          failed=()
          for ws in "${WORKSPACES[@]}"; do
            # Each workspace is time-boxed so one hang cannot eat the group.
            timeout 60m pnpm --filter "$ws" --if-present test:coverage > "/tmp/cov-$$.log" 2>&1
            code=$?
            if [ $code -ne 0 ]; then
              failed+=("$ws($code)")
              echo "::group::coverage FAILED $ws (exit $code)"
              # A suite that DIES contributes no coverage for everything it
              # would have exercised, so the list of failing suites IS the
              # coverage gap. `tail` alone showed only the last handful of
              # stack traces and hid which files died — which made a workspace
              # full of broken suites look identical to one that merely missed
              # its own threshold. jest and vitest both print "FAIL <path>", so
              # one grep serves every workspace.
              # Colour codes come off first. vitest emits them even down a
              # pipe, and an anchored grep can never match through them.
              plain="/tmp/cov-plain-$$.log"
              sed 's/\x1b\[[0-9;]*m//g' "/tmp/cov-$$.log" > "$plain"
              echo "--- failing suites ---"
              grep -a 'FAIL' "$plain" | sed 's/^[[:space:]]*//' | cut -c1-160 | sort -u | head -200
              echo "--- error headlines ---"
              grep -aE 'Error:|Error :|Invariant|Unable to find|Cannot find|not a function|No QueryClient|not wrapped' "$plain" |
                sed 's/^[[:space:]]*//' | cut -c1-160 | sort | uniq -c | sort -rn | head -40
              echo "--- totals / thresholds ---"
              grep -aE 'Test Suites:|Tests:|Test Files|does not meet|ERROR: Coverage' "$plain" | tail -20
              echo "::endgroup::"
            else
              echo "ok   $ws"
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::warning::coverage run did not succeed for: ${failed[*]}"
          fi
          exit 0
      - name: Collect lcov
        run: |
          mkdir -p lcov-out
          find . -name 'lcov.info' -not -path '*/node_modules/*' -print0 |
            while IFS= read -r -d '' f; do
              dest="lcov-out/$(dirname "${f#./}" | tr '/' '_').info"
              cp "$f" "$dest"
            done
          echo "collected $(ls -1 lcov-out | wc -l) report(s):"
          ls -la lcov-out
      - uses: actions/upload-artifact@v6
        with:
          name: lcov-${{ matrix.group.name }}
          path: lcov-out
          # warn, not error: a partial set of reports is still worth scanning,
          # and the analyze job verifies the count and fails loudly if it is
          # short. Failing HERE only threw the partial results away.
          if-no-files-found: warn

  coverage-mobile:
    name: Coverage — mobile app
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: probe
    if: needs.probe.outputs.up == 'true' && !inputs.skip_coverage
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/mobile-app/package-lock.json
      # Standalone (npm, outside the pnpm workspace).
      #
      # SonarQube was reporting 17.7% for the app while a full local run of the
      # same suite covers 82% of lines — the lcov this job uploaded was partial.
      # Jest with 400+ React Native suites on a 2-core / 7 GB runner is exactly
      # where workers run out of heap and the run ends early with whatever
      # coverage it had. So: a bounded heap, a worker memory limit so a leaking
      # worker is recycled instead of killed, and an observability step that
      # prints what was actually produced — a partial report must never again be
      # indistinguishable from a complete one.
      - name: Run coverage
        continue-on-error: true
        working-directory: app/mobile-app
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npm ci
          # src/generated/ is gitignored, so `@/generated/graphql` does not exist
          # in a fresh checkout. Without this, 274 of the 417 suites died with
          # "Could not locate module @/generated/graphql" and the app reported
          # 16.5% — a figure about the checkout, not the tests. apps-ci.yml runs
          # the same step for the same reason; the schema is read from the
          # server sources in the checkout, so no running server is needed.
          npm run codegen
          npx jest --coverage --ci --maxWorkers=2 --workerIdleMemoryLimit=1536MB 2>&1 | tee jest-coverage.log | tail -120
      - name: Coverage produced
        working-directory: app/mobile-app
        run: |
          echo "--- jest summary ---"
          grep -E '^(Test Suites|Tests|Statements|Branches|Functions|Lines)\s*:' jest-coverage.log || echo "(no summary lines — the run did not finish)"
          if [ -f coverage/lcov.info ]; then
            node -e '
              const fs=require("fs");let sf=0,lf=0,lh=0;
              for(const l of fs.readFileSync("coverage/lcov.info","utf8").split(/\r?\n/)){
                if(l.startsWith("SF:"))sf++;else if(l.startsWith("LF:"))lf+=+l.slice(3);else if(l.startsWith("LH:"))lh+=+l.slice(3);
              }
              console.log("lcov: files="+sf+" lines="+lh+"/"+lf+" = "+(lf?(100*lh/lf).toFixed(1):"0")+"%");
              if(sf<600) console.log("::warning::mobile lcov instruments only "+sf+" files — a full run instruments ~900. The upload is PARTIAL.");
            '
          else
            echo "::error::app/mobile-app/coverage/lcov.info was not written — the jest run died before reporting."
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: mobile-lcov
          path: app/mobile-app/coverage/lcov.info
          # warn, not error: analyze verifies the overall report count and a
          # partial app report is still worth scanning.
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # The scan itself. Needs the full history (fetch-depth: 0) for accurate
  # new-code / blame attribution.
  # ---------------------------------------------------------------------------
  analyze:
    name: Build and analyze
    runs-on: ubuntu-latest
    # Without this the job inherits GitHub's 6-hour default, and a scanner
    # that wedges on the bridge server holds the concurrency group for that
    # whole time — every queued scan behind it starves and the gate keeps
    # serving a stale analysis. A healthy scan of this monorepo lands well
    # inside 90 minutes, so anything past that is hung, not slow: fail it and
    # let the next queued commit have the runner.
    timeout-minutes: 90
    needs: [probe, coverage-workspaces, coverage-mobile]
    # `always()` so a skipped/failed coverage job still lets the scan run —
    # a scan without coverage beats no scan at all.
    if: always() && needs.probe.outputs.up == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # shallow clones hurt new-code relevancy

      # -----------------------------------------------------------------------
      # Dependencies. The JS/TS sensor builds its type graph from the tsconfigs
      # it discovers, and an `extends` that names a PACKAGE — rather than a
      # relative path — only resolves once that package is on disk. This job ran
      # with no install at all, so those configs could not be parsed and every
      # scan reported:
      #
      #   Failed to parse TSConfig file .../app/mobile-app/e2e/tsconfig.json.
      #   At least one referenced/extended tsconfig.json was not found in the
      #   project. Please run 'npm install' for a more complete analysis.
      #
      # Only two families are affected: app/mobile-app/tsconfig.json (extends
      # `expo/tsconfig.base`, and e2e/tsconfig.json extends THAT — which is the
      # file the warning names) and the Astro sites (`astro/tsconfigs/strict`).
      # Everything else reaches tsconfig.base.json by relative path and always
      # parsed. Without this the type-aware rules stay quiet over the app and
      # the websites, so the issue list describes the checkout, not the code.
      #
      # Both installs are continue-on-error: a degraded type graph is exactly
      # what we have today, so an install hiccup must not also cost us the scan.
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      # The app is standalone (npm, outside the pnpm workspace), so its
      # node_modules — and therefore `expo/tsconfig.base` — only exists after
      # this. codegen runs for the reason coverage-mobile runs it: src/generated/
      # is gitignored, so in a fresh checkout every `@/generated/graphql` import
      # is unresolvable. The schema is read from the server sources already in
      # the checkout, so no running server is needed.
      - name: Install mobile app dependencies
        continue-on-error: true
        working-directory: app/mobile-app
        run: |
          npm ci
          npm run codegen

      # One artifact per matrix group (lcov-server, lcov-mweb, …), merged into
      # one directory. The mobile artifact is named mobile-lcov on purpose so
      # this glob does not also sweep it in.
      - name: Download workspace lcov
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          pattern: lcov-*
          merge-multiple: true
          path: lcov-out

      - name: Download mobile lcov
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          name: mobile-lcov
          path: app/mobile-app/coverage

      # Put each lcov back where sonar.javascript.lcov.reportPaths expects it.
      - name: Restore lcov layout
        continue-on-error: true
        run: |
          shopt -s nullglob
          for f in lcov-out/*.info; do
            dir=$(basename "$f" .info | tr '_' '/')
            mkdir -p "$dir"
            cp "$f" "$dir/lcov.info"
          done
          echo "lcov reports available to the scanner:"
          find . -name 'lcov.info' -not -path '*/node_modules/*' | sort | sed 's/^/  /'

      # Each runner writes `SF:` paths relative to its OWN workspace, but Sonar
      # resolves them against the repo root — so `SF:src/Foo.tsx` from a portal
      # became `<repo>/src/Foo.tsx`, matched nothing, and the coverage was
      # dropped without any warning. That is why packages/portals/server/website
      # all reported 0.0% while their own 100% thresholds passed locally.
      # This rewrites every path to repo-root relative so the scan actually
      # counts the suites we already have. NOT continue-on-error: silently
      # scanning with unusable coverage is the exact failure we are fixing.
      #
      # The report list itself is DISCOVERED here rather than hand-maintained in
      # sonar-project.properties. That list had already drifted — five packages
      # with passing suites (ad-request-form, datetime, fallback-icons, i18n,
      # slack) were never in it, so their coverage was thrown away too. The
      # filesystem is the one source of truth (rule 34); a new package needs no
      # edit here to be counted.
      # The new-code period is PREVIOUS_VERSION, but no sonar.projectVersion was
      # ever passed — so Sonar had no previous version to diff against and
      # treated the ENTIRE codebase as new: 184,333 "new" lines, which is why
      # new_coverage read as a whole-repo figure instead of a figure for the code
      # actually being changed. The repo already carries a per-commit version
      # (rule 33) and deploy.yml reads it exactly this way.
      #
      # NOTE: the first analysis carrying a version has nothing before it to
      # compare with, so the new-code window only becomes meaningful from the
      # scan after this one.
      - name: Resolve project version
        run: echo "SONAR_PROJECT_VERSION=$(node -p "require('./app/mobile-app/app.json').expo.version")" >> "$GITHUB_ENV"

      - name: Normalize lcov paths
        if: ${{ !inputs.skip_coverage }}
        run: |
          node scripts/normalize-lcov.mjs
          paths=$(find . -name 'lcov.info' -not -path '*/node_modules/*' | sed 's|^\./||' | sort | paste -sd, -)
          echo "Reports handed to the scanner: $paths"
          echo "SONAR_LCOV_PATHS=$paths" >> "$GITHUB_ENV"

      # The scan used to publish 5.4% coverage without a single warning: the
      # workspace lcov artifact was missing, every workspace but the mobile app
      # reported exactly 0.0%, and nothing in the pipeline said so. A silently
      # coverage-less scan is worse than a failed one, because the quality gate
      # then reports a number that describes the pipeline rather than the code.
      #
      # The floor is deliberately well under the ~40 reports a healthy run
      # produces: this is a smoke alarm for "the artifact went missing", not a
      # coverage threshold. The gate itself judges the percentage.
      - name: Verify coverage reached the scanner
        if: ${{ !inputs.skip_coverage }}
        run: |
          count=$(find . -name 'lcov.info' -not -path '*/node_modules/*' | wc -l)
          echo "lcov reports available to the scanner: $count"
          if [ "$count" -lt 20 ]; then
            echo "::error::Only $count lcov report(s) reached the scanner (expected 20+)."
            echo "::error::The coverage jobs did not deliver their artifacts, so this"
            echo "::error::scan would report a coverage figure for the pipeline, not the code."
            exit 1
          fi

      # SonarQube keeps a per-file analysis cache; reusing it across runs is the
      # single biggest saving on a repeat scan of the same branch.
      - name: Cache SonarQube analysis
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: sonar-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            sonar-cache-${{ runner.os }}-${{ github.ref_name }}-
            sonar-cache-${{ runner.os }}-

      # The probe job ran BEFORE the two coverage jobs — twenty-odd minutes ago.
      # A manually-managed VPS can die inside that window, and then the scan
      # fails for precisely the "no good reason" the probe was added to avoid
      # (the probe only ever guarded the START of the run). Ask again at the one
      # moment that matters. This does NOT swallow scanner errors: if the server
      # answers, the scan runs and any real failure still reds the pipeline.
      - name: Re-check SonarQube availability
        id: recheck
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "$SONAR_HOST_URL/api/server/version" || echo "000")
          if [ "$code" = "200" ]; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "up=false" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.fail_on_unreachable }}" = "true" ]; then
              echo "::error::SonarQube went down after the probe (HTTP $code)."
              exit 1
            fi
            echo "::warning::SonarQube went down after the probe (HTTP $code) — skipping the scan."
          fi

      - uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        if: steps.recheck.outputs.up == 'true'
        with:
          # The set actually present on disk (see "Normalize lcov paths" above).
          # Left empty on a skip_coverage run so the scan still publishes rather
          # than being handed an empty reportPaths and reporting a false 0%.
          args: >-
            -Dsonar.projectVersion=${{ env.SONAR_PROJECT_VERSION }}
            ${{ env.SONAR_LCOV_PATHS && format('-Dsonar.javascript.lcov.reportPaths={0}', env.SONAR_LCOV_PATHS) || '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          # NB: SONAR_USER_HOME is left at its default (~/.sonar) so the cache
          # step above actually hits — overriding it would silently orphan it.
          # The runner has ~16 GB. The scanner JVM holds the index; the Node
          # "bridge server" (sonar.javascript.node.maxspace in
          # sonar-project.properties) holds the TS type graph. Starve either and
          # the JS/TS sensor dies with "bridge server is unresponsive" after ~25
          # minutes, publishing nothing.
          SONAR_SCANNER_JAVA_OPTS: -Xmx4096m
