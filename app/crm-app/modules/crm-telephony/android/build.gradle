plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.duncit.crm'
version = '1.0.0'

android {
  namespace "com.duncit.crm.telephony"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
  // The call sync after each CRM call (CallSyncWorker); the same version expo-background-task uses.
  implementation 'androidx.work:work-runtime-ktx:2.9.1'
}
