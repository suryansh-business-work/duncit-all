# In-container nginx config for the STATIC multi-page Astro sites (ads and
# earnwith). It is spa.conf with one difference — keep the two in step:
# there is no SPA fallback. These sites are pre-rendered pages, not a client
# router, so an unknown path is a real 404 and gets the site's own built
# 404.html with status 404. spa.conf answers it with the home page and a 200,
# which tells crawlers and link checkers that every typo is a live page.
#
# A site WITHOUT a 404 page (partners, today) stays on spa.conf: here it would
# show nginx's bare default page instead.

# Cache-Control per path, decided here instead of by an `add_header` in each
# location. nginx drops EVERY inherited add_header from a location that declares
# one of its own, so a per-location Cache-Control would silently strip the
# security headers below from exactly the files that carry them most: the JS.
# Exact matches win, then the regexes in order — the hashed-bundle rule sits
# above the generic extension rule on purpose. An empty value sends no header.
map $uri $spa_cache_control {
  default                                                   "";
  /sw.js                                                    "no-cache, no-store, must-revalidate";
  /manifest.webmanifest                                     "no-cache";
  ~^/\.well-known/                                          "public, max-age=300";
  ~^/(?:assets|_astro)/                                     "public, immutable";
  ~*\.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ "public, max-age=2592000";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Cache-Control $spa_cache_control;

  # Security headers for every page and asset. No Duncit surface frames another
  # (the only iframes are Google Maps, blob prints and srcdoc email previews),
  # so SAMEORIGIN costs nothing and stops clickjacking. HSTS leaves out
  # includeSubDomains: not every *.duncit.com host is ours to promise HTTPS for.
  # A Content-Security-Policy is deliberately not here yet — it needs a
  # report-only rollout per surface first (Maps, ImageKit, Razorpay, Google sign-in).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  # Pre-rendered pages only: a file, a directory's index.html (Astro's default
  # build format) or <path>.html (the `file` format). Anything else is a 404,
  # answered with the site's 404.html. Scoped to this location so a missing
  # /.well-known/ file below stays a bare 404 rather than an HTML page.
  location / {
    try_files $uri $uri/ $uri.html =404;
    error_page 404 /404.html;
  }

  # App-link association files. They must be served VERBATIM as JSON, and the
  # SPA fallback above was answering both with index.html — which is why
  # Android's verifier saw HTML and refused to open the app for mweb links.
  # `apple-app-site-association` has no extension, so nginx would otherwise
  # serve it as application/octet-stream, which iOS ignores. `^~` keeps this
  # ahead of the static-asset regex, and a 404 stays a 404 rather than
  # becoming a page: a phone that gets HTML here caches the failure.
  location ^~ /.well-known/ {
    default_type application/json;
    try_files $uri =404;
  }

  # PWA (mweb) — never cache the service worker or manifest.
  location = /sw.js {
    expires 0;
  }
  location = /manifest.webmanifest {
    expires 0;
  }

  # Content-hashed bundles — long immutable cache. `^~` beats the regex below.
  location ^~ /assets/ {
    expires 1y;
  }
  location ^~ /_astro/ {
    expires 1y;
  }

  # Other static assets — medium cache.
  location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
    expires 30d;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
