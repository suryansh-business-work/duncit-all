<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Mirrors dark.bg / light.bg in @duncit/auth-tokens: the browser chrome before any script runs. -->
    <meta name="theme-color" content="#0e1012" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f3ef" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <!-- The Duncit Lite mark: the 64px tab icon (built from the fallback-icon set), and 192px for high-density screens and search results. -->
    <link rel="icon" type="image/png" sizes="64x64" href="/shared/fallback-icons/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/mark-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS paints a transparent icon black, so its own icon sits on the dark page colour. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- meta:start -->
    <title>Duncit Lite</title>
    <meta name="description" content="Create an event page, invite people and manage guests in minutes, with Duncit Lite." />
    <!-- meta:end -->
  </head>
  <body>
    <div id="root"><!--ssr:start-->
      <output id="boot-loader" style="position:fixed;inset:0;display:grid;place-items:center;background:#0e1012;font-family:Nunito,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
        <span style="display:flex;flex-direction:column;align-items:center;gap:16px">
          <span aria-hidden="true" style="display:block;width:44px;height:44px;border:4px solid rgba(255,255,255,0.12);border-top-color:#ff5757;border-radius:50%;animation:duncit-boot-spin .8s linear infinite"></span>
          <span style="color:#9aa0a8;font-weight:600;font-size:14px">Loading Duncit Lite…</span>
        </span>
      </output>
      <style>@keyframes duncit-boot-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){#boot-loader [aria-hidden]{animation:none}}</style>
    <!--ssr:end--></div>
    <script type="module" src="/web/main.tsx"></script>
  </body>
</html>
