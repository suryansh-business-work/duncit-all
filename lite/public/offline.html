<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e1012" />
    <title>You are offline · Duncit Lite</title>
    <style>
      /* Colours mirror dark.* in @duncit/auth-tokens; this page renders with no script and no network. */
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #0e1012; color: #f2f4f1; font-family: Nunito, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 360px; }
      h1 { font-size: 1.5rem; margin: 16px 0 8px; }
      p { color: #9aa0a8; line-height: 1.5; margin: 0 0 24px; }
      a { display: inline-block; background: #f2f4f1; color: #0e1012; text-decoration: none; font-weight: 700; padding: 12px 20px; border-radius: 8px; }
      a:focus-visible { outline: 3px solid #ff5757; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="48" height="48" style="border-radius: 12px" />
      <h1>You are offline</h1>
      <p>Duncit Lite needs a connection to show events and tickets. Check your internet and try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
