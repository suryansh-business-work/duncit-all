# pnpm 10 stopped running dependency install scripts unless they are named
# here. Every one below either downloads the binary it IS (esbuild, cypress,
# ffmpeg-static) or builds a native binding, so a blocked script does not fail
# the install — it fails later, at the first vite build or the first image
# upload, pointing at the wrong thing.
allowBuilds:
  '@apollo/protobufjs': true
  '@parcel/watcher': true
  cypress: true
  esbuild: true
  ffmpeg-static: true
  # The one deliberate NO, carried over from the old neverBuiltDependencies:
  # its postinstall downloads a mongod binary, and the suites that need one
  # fetch it themselves at run time.
  mongodb-memory-server: false
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - jscpd@5.1.0 || 5.1.1
  - nodemailer@9.1.0
  - '@tiptap/core@3.30.6'
