# SonarQube analysis config, consumed by .github/workflows/sonar.yml.
# SONAR_HOST_URL + SONAR_TOKEN come from GitHub secrets; this file supplies the
# mandatory projectKey the scanner was missing. The project is auto-provisioned
# on first analysis at https://sonarqube.duncit.com.
sonar.projectKey=suryansh-business-work_duncit-all_4f460a81-a423-455b-81e3-8792ab4b2046
sonar.projectName=duncit-all
sonar.sourceEncoding=UTF-8

# The JS/TS analyzer runs a Node "bridge server" that holds the whole type graph
# in memory. On a monorepo this size (server + mWeb + mobile + 17 portals + 5
# websites) it OOMs at Node's ~2 GB default and the scan dies with
# "The bridge server is unresponsive" after ~25 minutes, publishing nothing.
sonar.javascript.node.maxspace=8192

# Scan the whole monorepo source, skipping build artefacts, deps, generated code
# and the vendored open-wa-server (third-party — we don't apply our standards to
# it, so it must not count toward the quality gate; see CLAUDE.md rule 35).
# A `<dockerfile>.dockerignore` must carry exactly that name for BuildKit to
# find it, which also makes it match the Docker sensor's `Dockerfile*` pattern —
# so the sensor parsed app/mobile-app/Dockerfile.android.dockerignore as a
# Dockerfile and reported "Cannot parse ...dockerignore:12:1" on its first
# block-list line. It is an ignore list, not a Dockerfile, and no analyser has a
# language for it.
#
# Video assets carry no analysable code and the scanner drops anything over
# 20 MB anyway ("File .../duncit-reel.mp4 is bigger than 20MB and as consequence
# is removed from the analysis scope"). Excluding them keeps that out of the log.
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/cypress-artifacts/**,**/.astro/**,**/generated/**,**/*.min.*,**/android/**,**/ios/**,pnpm-lock.yaml,portals/crm/open-wa-server/**,**/*.dockerignore,**/*.mp4,**/*.mov,**/*.webm

# ---------------------------------------------------------------------------
# Copy-paste detection. The Ask Bot page catalogue is a DATA table — ~860 rows
# of `{ surface, path, label, group, description }` describing every page in the
# product (see CLAUDE.md rule on the navigation bot). Every row necessarily has
# the same shape, so CPD reads the table as one huge duplication cluster and
# warned "Too many duplication groups on file askBot.catalog.apps.ts. Keep only
# the first 100 groups." There is no logic to factor out — the repetition IS the
# record format — and leaving it in means the gate's "duplicated lines on new
# code" condition fires on any commit that adds pages.
# ---------------------------------------------------------------------------
sonar.cpd.exclusions=server/src/modules/ai/askBot/askBot.catalog.*.ts

# ---------------------------------------------------------------------------
# Rule exclusions — each one is a FALSE POSITIVE with a named cause, not a
# silenced real finding. Keep this list short and keep every entry scoped to a
# single rule in a single file.
#
# e1 — S2068 ("review this potentially hard-coded password") on
# shipped-keys.ts. That file is GENERATED by scripts/generate-shipped-keys.mjs
# and holds nothing but `localization key -> English copy` rows. The detector
# keys off the token "password" appearing beside a string literal, so the
# `mweb.passwordRecovery.*` namespace trips it on plain UI copy — the three it
# flagged were the email placeholder "riya@duncit.com", the phone placeholder
# "9876543210" and the button label "Verifying...". None is a credential and
# none can be, because the file carries no configuration at all.
#
# This is an exclusion rather than three "false positive" marks in the UI on
# purpose: the file is regenerated on every localization change, so each new
# passwordRecovery key would raise the issue again and re-break the gate. The
# scope is one rule in one generated file, so a real hard-coded secret
# anywhere else in server/src is still reported.
# ---------------------------------------------------------------------------
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.e1.resourceKey=server/src/modules/platform/localization/shipped-keys.ts

# Test files (kept separate from production sources in the analysis).
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.cy.ts,**/*.cy.tsx,**/__tests__/**,**/e2e/**
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/build/**

# ---------------------------------------------------------------------------
# Coverage. The scanner never runs tests — it only reads the lcov each runner
# emits, and it resolves every `SF:` path against THIS directory. Each runner
# writes paths relative to its own workspace, so scripts/normalize-lcov.mjs
# rewrites them to repo-root relative in sonar.yml before the scan; without
# that step Sonar silently drops the coverage and the gate sees 0%.
#
# The report list is NOT declared here. sonar.yml discovers every lcov.info on
# disk and passes it as -Dsonar.javascript.lcov.reportPaths, so a new package
# is counted without editing this file. The hand-maintained list this replaces
# had already drifted: five packages with passing suites were missing from it.
# ---------------------------------------------------------------------------

# Files that carry no testable logic — counting them as "uncovered" only drags
# the coverage figure down without telling us anything actionable.
sonar.coverage.exclusions=\
  **/*.config.{ts,js,mjs,cjs},\
  **/*.d.ts,\
  **/vite-env.d.ts,\
  **/main.tsx,\
  **/vitest.setup.ts,\
  **/scripts/**,\
  **/e2e/**,\
  **/__tests__/**,\
  **/*.stories.tsx,\
  server/src/graphql/**,\
  **/src/graphql/generated/**,\
  website/**/src/pages/**,\
  **/*.astro,\
  packages/*/src/index.ts
