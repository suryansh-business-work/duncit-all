<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F6F8" />
    <link rel="icon" type="image/svg+xml" href="/duncit-logo.svg" />
    <!-- meta:start -->
    <title>Duncit Pet Store</title>
    <meta name="description" content="Food, treats, toys and care for your pets, delivered by Duncit." />
    <!-- meta:end -->
  </head>
  <body>
    <!-- Static cold-start loader: shown instantly (no JS) and replaced by React
         on mount, so the boot wait is never a blank white screen. -->
    <div id="root">
      <output id="boot-loader" style="position:fixed;inset:0;display:grid;place-items:center;background:#F6F6F8;font-family:Nunito,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
        <span style="display:flex;flex-direction:column;align-items:center;gap:16px">
          <span aria-hidden="true" style="display:block;width:44px;height:44px;border:4px solid #f3d4d4;border-top-color:#D92D2D;border-radius:50%;animation:duncit-boot-spin .8s linear infinite"></span>
          <span style="color:#6b7280;font-weight:600;font-size:14px">Loading Duncit Pet Store…</span>
        </span>
      </output>
      <style>@keyframes duncit-boot-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){#boot-loader [aria-hidden]{animation:none}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
